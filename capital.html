<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Guess the Capital | Guessing Games</title>

  <style>
    :root {
      --brand: #4f86b3;
      --brand-dark: #376f9c;
      --bg: #f6f9fc;
      --ink: #172331;
      --muted: #66788a;
      --line: #dbe6ef;
      --soft: #edf4fa;
      --white: #ffffff;
      --correct: #2f9e67;
      --correct-soft: #e9f7ef;
      --wrong: #d95b5b;
      --wrong-soft: #fff0f0;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system,
        BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    a { color: inherit; text-decoration: none; }

    nav {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 999;
      padding: 1.25rem 2.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(247, 250, 252, 0.92);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid rgba(79, 134, 179, 0.18);
      transition: background 0.3s, box-shadow 0.3s;
    }

    nav.scrolled {
      background: rgba(247, 250, 252, 0.98);
      box-shadow: 0 4px 24px rgba(79, 134, 179, 0.12);
    }

    .nav-logo {
      color: var(--brand);
      font-size: 1.3rem;
      font-weight: 800;
      letter-spacing: 0.05em;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 2.5rem;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .nav-links a {
      color: var(--muted);
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      transition: color 0.2s;
    }

    .nav-links a:hover,
    .nav-links a.active { color: var(--brand); }

    .nav-account {
      padding: 9px 14px !important;
      color: var(--ink) !important;
      background: var(--white);
      border: 1px solid var(--line);
      border-radius: 999px;
      letter-spacing: 0.04em !important;
      text-transform: none !important;
    }

    .hamburger {
      display: none;
      padding: 8px;
      color: var(--ink);
      background: none;
      border: 0;
      font-size: 1.25rem;
      cursor: pointer;
    }

    .page {
      width: min(100%, 980px);
      margin: 0 auto;
      padding: 128px 24px 64px;
    }

    .hero {
      display: grid;
      justify-items: center;
      text-align: center;
      gap: 12px;
      margin-bottom: 26px;
    }

    .eyebrow {
      color: var(--brand);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(44px, 8vw, 78px);
      line-height: 0.95;
      letter-spacing: -0.07em;
      font-weight: 850;
    }

    .subtitle {
      margin: 3px 0 0;
      color: var(--muted);
      font-size: 16px;
      font-weight: 550;
    }

    .game-shell {
      background: var(--white);
      border: 1px solid var(--line);
      border-radius: 28px;
      box-shadow: 0 20px 50px rgba(23, 35, 49, 0.08);
      overflow: hidden;
    }

    .game-topbar {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      padding: 18px;
      border-bottom: 1px solid var(--line);
      background: linear-gradient(180deg, #ffffff, #fbfdff);
    }

    .stat {
      min-height: 66px;
      display: grid;
      place-items: center;
      text-align: center;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: var(--soft);
    }

    .stat-label {
      display: block;
      margin-bottom: 3px;
      color: var(--muted);
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .stat-value {
      font-size: 22px;
      font-weight: 850;
      letter-spacing: -0.04em;
    }

    .strikes {
      display: inline-flex;
      gap: 5px;
      font-size: 20px;
    }

    .strike.used {
      opacity: 0.22;
      filter: grayscale(1);
    }

    .game-content {
      padding: 28px;
    }

    .progress-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      margin-bottom: 16px;
    }

    .question-count {
      color: var(--brand);
      font-size: 12px;
      font-weight: 850;
      letter-spacing: 0.13em;
      text-transform: uppercase;
    }

    .progress-track {
      flex: 1;
      height: 8px;
      overflow: hidden;
      border-radius: 999px;
      background: var(--soft);
      border: 1px solid var(--line);
    }

    .progress-fill {
      width: 0%;
      height: 100%;
      background: var(--brand);
      border-radius: inherit;
      transition: width 0.25s ease;
    }

    .country-card {
      display: grid;
      place-items: center;
      min-height: 250px;
      margin-bottom: 22px;
      padding: 28px;
      border-radius: 24px;
      background:
        radial-gradient(circle at 50% 12%, rgba(79,134,179,.14), transparent 42%),
        var(--soft);
      border: 1px solid var(--line);
      text-align: center;
    }

    .country-label {
      color: var(--brand);
      font-size: 12px;
      font-weight: 850;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    .country-name {
      font-size: clamp(44px, 8vw, 76px);
      line-height: 0.95;
      letter-spacing: -0.065em;
      font-weight: 900;
      max-width: 100%;
      word-break: break-word;
    }

    .prompt {
      margin: 0 0 18px;
      text-align: center;
      font-size: clamp(22px, 4vw, 32px);
      line-height: 1.08;
      letter-spacing: -0.045em;
      font-weight: 850;
    }

    .answers {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .answer {
      min-height: 68px;
      padding: 14px 18px;
      text-align: left;
      color: var(--ink);
      background: var(--white);
      border: 1px solid var(--line);
      border-radius: 18px;
      font: inherit;
      font-size: 16px;
      font-weight: 750;
      cursor: pointer;
      transition: transform .15s, border-color .15s, background .15s, box-shadow .15s;
    }

    .answer:hover:not(:disabled) {
      transform: translateY(-2px);
      border-color: var(--brand);
      box-shadow: 0 10px 24px rgba(79, 134, 179, 0.12);
    }

    .answer.correct {
      background: var(--correct-soft);
      border-color: var(--correct);
      color: #1f704b;
    }

    .answer.wrong {
      background: var(--wrong-soft);
      border-color: var(--wrong);
      color: #9e3838;
    }

    .answer:disabled { cursor: default; }

    .feedback {
      min-height: 46px;
      display: grid;
      place-items: center;
      margin-top: 16px;
      text-align: center;
      color: var(--muted);
      font-size: 15px;
      font-weight: 700;
    }

    .next-btn,
    .restart-btn {
      display: none;
      width: 100%;
      min-height: 54px;
      margin-top: 4px;
      border: 0;
      border-radius: 999px;
      background: var(--brand);
      color: white;
      font: inherit;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
    }

    .next-btn:hover,
    .restart-btn:hover { background: var(--brand-dark); }

    .game-over {
      display: none;
      text-align: center;
      padding: 20px 4px 6px;
    }

    .game-over-icon {
      font-size: 54px;
      margin-bottom: 10px;
    }

    .game-over h2 {
      margin: 0;
      font-size: 38px;
      letter-spacing: -0.06em;
    }

    .game-over p {
      margin: 10px 0 22px;
      color: var(--muted);
      font-size: 16px;
      font-weight: 600;
    }

    .final-score {
      color: var(--brand);
      font-weight: 850;
    }


    /* DESKTOP: COUNTRY LEFT, ANSWERS RIGHT */
    @media (min-width: 901px) {
      .game-content {
        display: grid;
        grid-template-columns: minmax(0, 1.1fr) minmax(320px, 0.9fr);
        grid-template-areas:
          "country side";
        gap: 24px;
        align-items: center;
      }

      .country-card {
        grid-area: country;
        min-height: 360px;
        margin-bottom: 0;
      }

      .desktop-side {
        grid-area: side;
        display: flex;
        flex-direction: column;
        align-self: center;
      }

      .desktop-side .prompt {
        text-align: left;
        margin-bottom: 16px;
      }

      .desktop-side .answers {
        grid-template-columns: 1fr;
      }

      .desktop-side .feedback {
        margin-top: 16px;
      }

      .game-over {
        grid-column: 1 / -1;
      }
    }

    @media (max-width: 900px) {
      nav { padding: 1rem 1.5rem; }
      .nav-links { display: none; }
      .hamburger { display: block; }

      .nav-links.open {
        position: fixed;
        top: 62px;
        left: 0;
        right: 0;
        display: flex;
        flex-direction: column;
        align-items: stretch;
        gap: 0;
        padding: 1rem 1.5rem 1.5rem;
        background: rgba(247, 250, 252, 0.98);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border-bottom: 1px solid var(--line);
        box-shadow: 0 12px 30px rgba(23, 35, 49, 0.08);
      }

      .nav-links.open li { width: 100%; }
      .nav-links.open a {
        display: block;
        width: 100%;
        padding: 14px 4px;
        border-bottom: 1px solid rgba(79, 134, 179, 0.10);
      }
    }

    @media (max-width: 620px) {
      .page { padding: 108px 14px 38px; }
      nav { padding: 0.95rem 1rem; }
      .nav-logo { font-size: 1.1rem; }
      .nav-links.open { top: 58px; padding-left: 1rem; padding-right: 1rem; }

      h1 { font-size: 50px; }

      .game-topbar {
        grid-template-columns: 1fr 1fr;
      }

      .game-topbar .stat:last-child {
        grid-column: 1 / -1;
      }

      .game-content { padding: 18px; }

      .country-card {
        min-height: 210px;
        padding: 20px;
      }

      .country-name {
        font-size: 48px;
      }

      .answers { grid-template-columns: 1fr; }

      .answer {
        min-height: 58px;
        text-align: center;
      }
    }
  </style>
</head>

<body>
  <nav id="nav">
    <a href="index.html" class="nav-logo">Guessing Games</a>

    <ul class="nav-links" id="navMenu">
      <li><a href="index.html">Home</a></li>
      <li><a href="capitals.html" class="active">Games</a></li>
      <li><a href="halloffame.html">Hall of Fame</a></li>
      <li><a href="live.html">Live Shows</a></li>
      <li><a href="signin.html?redirect=capitals.html" class="nav-account">Sign in</a></li>
    </ul>

    <button class="hamburger" id="ham" type="button" aria-label="Open navigation" aria-expanded="false">
      ☰
    </button>
  </nav>

  <main class="page">
    <section class="hero">
      <div class="eyebrow">Geography Games</div>
      <h1>Guess the Capital</h1>
    </section>

    <section class="game-shell">
      <div class="game-topbar">
        <div class="stat">
          <div>
            <span class="stat-label">Score</span>
            <span class="stat-value" id="score">0</span>
          </div>
        </div>

        <div class="stat">
          <div>
            <span class="stat-label">High Score</span>
            <span class="stat-value" id="highScore">0</span>
          </div>
        </div>

        <div class="stat">
          <div>
            <span class="stat-label">Strikes</span>
            <span class="strikes" id="strikes">
              <span class="strike">❌</span>
              <span class="strike">❌</span>
              <span class="strike">❌</span>
            </span>
          </div>
        </div>
      </div>

      <div class="game-content">
        <div class="country-card">
          <div>
            <div class="country-label">Country</div>
            <div class="country-name" id="countryName">France</div>
          </div>
        </div>

        <div class="desktop-side">
          <h2 class="prompt">What is the capital?</h2>
          <div class="answers" id="answers"></div>
          <div class="feedback" id="feedback"></div>
          <button class="next-btn" id="nextBtn">Next Country →</button>
        </div>

        <div class="game-over" id="gameOver">
          <div class="game-over-icon">🌎</div>
          <h2>Game Over</h2>
          <p>You scored <span class="final-score" id="finalScore">0</span>.</p>
          <button class="restart-btn" id="restartBtn">Play Again</button>
        </div>
      </div>
    </section>
  </main>

  <script>
    const questions = [
      { country: "United States", capital: "Washington, D.C.", choices: ["Washington, D.C.", "New York City", "Philadelphia", "Boston"] },
      { country: "France", capital: "Paris", choices: ["Paris", "Lyon", "Marseille", "Nice"] },
      { country: "Japan", capital: "Tokyo", choices: ["Osaka", "Kyoto", "Tokyo", "Nagoya"] },
      { country: "Brazil", capital: "Brasília", choices: ["Rio de Janeiro", "São Paulo", "Brasília", "Salvador"] },
      { country: "Canada", capital: "Ottawa", choices: ["Toronto", "Vancouver", "Montreal", "Ottawa"] },
      { country: "Germany", capital: "Berlin", choices: ["Munich", "Berlin", "Frankfurt", "Hamburg"] },
      { country: "Italy", capital: "Rome", choices: ["Milan", "Rome", "Naples", "Florence"] },
      { country: "United Kingdom", capital: "London", choices: ["Manchester", "Edinburgh", "London", "Liverpool"] },
      { country: "Australia", capital: "Canberra", choices: ["Sydney", "Melbourne", "Canberra", "Brisbane"] },
      { country: "India", capital: "New Delhi", choices: ["Mumbai", "New Delhi", "Kolkata", "Bengaluru"] },
      { country: "Mexico", capital: "Mexico City", choices: ["Guadalajara", "Monterrey", "Mexico City", "Cancún"] },
      { country: "South Korea", capital: "Seoul", choices: ["Busan", "Seoul", "Incheon", "Daegu"] },
      { country: "Spain", capital: "Madrid", choices: ["Barcelona", "Madrid", "Valencia", "Seville"] },
      { country: "Argentina", capital: "Buenos Aires", choices: ["Córdoba", "Rosario", "Buenos Aires", "Mendoza"] },
      { country: "South Africa", capital: "Pretoria", choices: ["Cape Town", "Johannesburg", "Pretoria", "Durban"] },
      { country: "Sweden", capital: "Stockholm", choices: ["Gothenburg", "Malmö", "Stockholm", "Uppsala"] },
      { country: "Norway", capital: "Oslo", choices: ["Bergen", "Oslo", "Trondheim", "Stavanger"] },
      { country: "Greece", capital: "Athens", choices: ["Athens", "Thessaloniki", "Patras", "Heraklion"] },
      { country: "Portugal", capital: "Lisbon", choices: ["Porto", "Lisbon", "Braga", "Faro"] },
      { country: "Thailand", capital: "Bangkok", choices: ["Phuket", "Chiang Mai", "Bangkok", "Pattaya"] },
      { country: "Switzerland", capital: "Bern", choices: ["Zurich", "Geneva", "Bern", "Basel"] },
      { country: "Philippines", capital: "Manila", choices: ["Cebu City", "Davao City", "Manila", "Quezon City"] },
      { country: "Turkey", capital: "Ankara", choices: ["Istanbul", "Ankara", "Izmir", "Antalya"] },
      { country: "New Zealand", capital: "Wellington", choices: ["Auckland", "Christchurch", "Wellington", "Hamilton"] },
      { country: "Egypt", capital: "Cairo", choices: ["Alexandria", "Cairo", "Giza", "Luxor"] },
      { country: "China", capital: "Beijing", choices: ["Shanghai", "Beijing", "Shenzhen", "Guangzhou"] },
      { country: "Kenya", capital: "Nairobi", choices: ["Mombasa", "Nairobi", "Kisumu", "Nakuru"] },
      { country: "Peru", capital: "Lima", choices: ["Cusco", "Arequipa", "Lima", "Trujillo"] },
      { country: "Ireland", capital: "Dublin", choices: ["Cork", "Galway", "Dublin", "Limerick"] },
      { country: "Morocco", capital: "Rabat", choices: ["Casablanca", "Marrakesh", "Rabat", "Fez"] }
    ];

    const countryNameEl = document.getElementById("countryName");
    const answersEl = document.getElementById("answers");
    const scoreEl = document.getElementById("score");
    const highScoreEl = document.getElementById("highScore");
    const strikesEl = document.getElementById("strikes");
    const feedbackEl = document.getElementById("feedback");
    const nextBtn = document.getElementById("nextBtn");
    const restartBtn = document.getElementById("restartBtn");
    const gameOverEl = document.getElementById("gameOver");
    const finalScoreEl = document.getElementById("finalScore");

    let score = 0;
    let strikes = 0;
    let currentQuestion = null;
    let answered = false;
    let deck = [];

    let highScore = Number(localStorage.getItem("capitalGameHighScore") || 0);
    highScoreEl.textContent = highScore;

    function shuffle(array) {
      const copy = [...array];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function resetDeck() {
      // Endless mode: after every country has appeared, reshuffle the full set
      // and continue. The only game-over condition is reaching 3 strikes.
      deck = shuffle(questions);
    }

    function updateStrikes() {
      [...strikesEl.querySelectorAll(".strike")].forEach((el, index) => {
        el.classList.toggle("used", index >= strikes);
      });
    }

    function updateHighScore() {
      if (score > highScore) {
        highScore = score;
        localStorage.setItem("capitalGameHighScore", String(highScore));
        highScoreEl.textContent = highScore;
      }
    }

    function loadQuestion() {
      answered = false;
      feedbackEl.textContent = "";
      nextBtn.style.display = "none";
      gameOverEl.style.display = "none";

      if (!deck.length) resetDeck();
      currentQuestion = deck.pop();
      countryNameEl.textContent = currentQuestion.country;

      answersEl.innerHTML = "";
      shuffle(currentQuestion.choices).forEach(choice => {
        const btn = document.createElement("button");
        btn.className = "answer";
        btn.type = "button";
        btn.textContent = choice;
        btn.addEventListener("click", () => chooseAnswer(btn, choice));
        answersEl.appendChild(btn);
      });
    }

    function chooseAnswer(button, choice) {
      if (answered) return;
      answered = true;

      const buttons = [...answersEl.querySelectorAll(".answer")];
      buttons.forEach(btn => btn.disabled = true);

      if (choice === currentQuestion.capital) {
        score += 1;
        scoreEl.textContent = score;
        button.classList.add("correct");
        feedbackEl.textContent = "Correct! +1";
        updateHighScore();
      } else {
        strikes += 1;
        button.classList.add("wrong");
        const correctBtn = buttons.find(btn => btn.textContent === currentQuestion.capital);
        if (correctBtn) correctBtn.classList.add("correct");
        feedbackEl.textContent = `The capital is ${currentQuestion.capital}.`;
        updateStrikes();
      }

      if (strikes >= 3) {
        setTimeout(endGame, 650);
      } else {
        nextBtn.style.display = "block";
      }
    }

    function endGame() {
      answersEl.style.display = "none";
      feedbackEl.style.display = "none";
      nextBtn.style.display = "none";
      document.querySelector(".country-card").style.display = "none";
      document.querySelector(".prompt").style.display = "none";

      finalScoreEl.textContent = score;
      gameOverEl.style.display = "block";
      restartBtn.style.display = "block";
      updateHighScore();
    }

    function restartGame() {
      score = 0;
      strikes = 0;
      scoreEl.textContent = "0";
      updateStrikes();

      answersEl.style.display = "grid";
      feedbackEl.style.display = "grid";
      document.querySelector(".country-card").style.display = "grid";
      document.querySelector(".prompt").style.display = "block";
      restartBtn.style.display = "none";

      resetDeck();
      loadQuestion();
    }

    nextBtn.addEventListener("click", loadQuestion);
    restartBtn.addEventListener("click", restartGame);

    const ham = document.getElementById("ham");
    const navMenu = document.getElementById("navMenu");

    ham.addEventListener("click", () => {
      navMenu.classList.toggle("open");
      ham.setAttribute("aria-expanded", navMenu.classList.contains("open"));
    });

    window.addEventListener("scroll", () => {
      document.getElementById("nav").classList.toggle("scrolled", window.scrollY > 10);
    });

    updateStrikes();
    resetDeck();
    loadQuestion();
  </script>
</body>
</html>
