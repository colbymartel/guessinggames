    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system,

    }

    a { color: inherit; text-decoration: none; }

    nav {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 999;
      padding: 1.25rem 2.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(247, 250, 252, 0.92);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid rgba(79, 134, 179, 0.18);
      transition: background 0.3s, box-shadow 0.3s;
    }

    nav.scrolled {
      background: rgba(247, 250, 252, 0.98);
      box-shadow: 0 4px 24px rgba(79, 134, 179, 0.12);
    }

    .nav-logo {
      color: var(--brand);
      font-size: 1.3rem;
      font-weight: 800;
      letter-spacing: 0.05em;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 2.5rem;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .nav-links a {
      color: var(--muted);
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      transition: color 0.2s;
    }

    .nav-links a:hover,
    .nav-links a.active { color: var(--brand); }

    .nav-account {
      padding: 9px 14px !important;
      color: var(--ink) !important;
      background: var(--white);
      border: 1px solid var(--line);
      border-radius: 999px;
      letter-spacing: 0.04em !important;
      text-transform: none !important;
    }

    .hamburger {
      display: none;
      padding: 8px;
      color: var(--ink);
      background: none;
      border: 0;
      font-size: 1.25rem;
      cursor: pointer;
    }

    .page {
      width: min(100%, 980px);
      margin: 0 auto;
      padding: 128px 24px 64px;
    }

    .hero {
      display: grid;
      justify-items: center;
      text-align: center;
      gap: 12px;
      margin-bottom: 26px;
    }

    .eyebrow {
      color: var(--brand);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(44px, 8vw, 78px);
      line-height: 0.95;
      letter-spacing: -0.07em;
      font-weight: 850;
    }

    .subtitle {
      margin: 3px 0 0;
      color: var(--muted);
      font-size: 16px;
      font-weight: 550;
    }

    .game-shell {
      background: var(--white);
      border: 1px solid var(--line);
      border-radius: 28px;
      box-shadow: 0 20px 50px rgba(23, 35, 49, 0.08);
      overflow: hidden;
    }

    .game-topbar {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      padding: 18px;
      border-bottom: 1px solid var(--line);
      background: linear-gradient(180deg, #ffffff, #fbfdff);
    }

    .stat {
      min-height: 66px;
      display: grid;
      place-items: center;
      text-align: center;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: var(--soft);
    }

    .stat-label {
      display: block;
      margin-bottom: 3px;
      color: var(--muted);
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .stat-value {
      font-size: 22px;
      font-weight: 850;
      letter-spacing: -0.04em;
    }

    .game-content {
      padding: 28px;
    }

    .progress-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      margin-bottom: 16px;
    }

    .question-count {
      color: var(--brand);
      font-size: 12px;
      font-weight: 850;
      letter-spacing: 0.13em;
      text-transform: uppercase;
    }

    .progress-track {
      flex: 1;
      height: 8px;
      overflow: hidden;
      border-radius: 999px;
      background: var(--soft);
      border: 1px solid var(--line);
    }

    .progress-fill {
      width: 0%;
      height: 100%;
      background: var(--brand);
      border-radius: inherit;
      transition: width 0.25s ease;
    }

    .country-card {
      display: grid;
      place-items: center;
      min-height: 250px;
      margin-bottom: 22px;
      padding: 28px;
      border-radius: 24px;
      background:
        radial-gradient(circle at 50% 12%, rgba(79,134,179,.14), transparent 42%),
        var(--soft);
      border: 1px solid var(--line);
      text-align: center;
    }

    .country-label {
      color: var(--brand);
      font-size: 12px;
      font-weight: 850;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    .country-name {
      font-size: clamp(44px, 8vw, 76px);
      line-height: 0.95;
      letter-spacing: -0.065em;
      font-weight: 900;
      max-width: 100%;
      word-break: break-word;
    }

    .prompt {
      margin: 0 0 18px;
      text-align: center;
      font-size: clamp(22px, 4vw, 32px);
      line-height: 1.08;
      letter-spacing: -0.045em;
      font-weight: 850;
    }

    .answers {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .answer {
      min-height: 68px;
      padding: 14px 18px;
      text-align: left;
      color: var(--ink);
      background: var(--white);
      border: 1px solid var(--line);
      border-radius: 18px;
      font: inherit;
      font-size: 16px;
      font-weight: 750;
      cursor: pointer;
      transition: transform .15s, border-color .15s, background .15s, box-shadow .15s;
    }

    .answer:hover:not(:disabled) {
      transform: translateY(-2px);
      border-color: var(--brand);
      box-shadow: 0 10px 24px rgba(79, 134, 179, 0.12);
    }

    .answer.correct {
      background: var(--correct-soft);
      border-color: var(--correct);
      color: #1f704b;
    }

    .answer.wrong {
      background: var(--wrong-soft);
      border-color: var(--wrong);
      color: #9e3838;
    }

    .answer:disabled { cursor: default; }

    .feedback {
      min-height: 46px;
      display: grid;
      place-items: center;
      margin-top: 16px;
      text-align: center;
      color: var(--muted);
      font-size: 15px;
      font-weight: 700;
    }

    .next-btn,
    .restart-btn {
      display: none;
      width: 100%;
      min-height: 54px;
      margin-top: 4px;
      border: 0;
      border-radius: 999px;
      background: var(--brand);
      color: white;
      font: inherit;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
    }

    .next-btn:hover,
    .restart-btn:hover { background: var(--brand-dark); }

    .game-over {
      display: none;
      text-align: center;
      padding: 20px 4px 6px;
    }

    .game-over-icon {
      font-size: 54px;
      margin-bottom: 10px;
    }

    .game-over h2 {
      margin: 0;
      font-size: 38px;
      letter-spacing: -0.06em;
    }

    .game-over p {
      margin: 10px 0 22px;
      color: var(--muted);
      font-size: 16px;
      font-weight: 600;
    }

    .final-score {
      color: var(--brand);
      font-weight: 850;
    }

    @media (min-width: 901px) {
      .game-content {
        display: grid;
        grid-template-columns: minmax(0, 1.1fr) minmax(320px, 0.9fr);
        grid-template-areas:

        gap: 24px;
        align-items: center;
      }

      .country-card {
        grid-area: country;
        min-height: 360px;
        margin-bottom: 0;
      }

      .desktop-side {
        grid-area: side;
        display: flex;
        flex-direction: column;
        align-self: center;
      }

      .desktop-side .prompt {
        text-align: left;
        margin-bottom: 16px;
      }

      .desktop-side .answers {
        grid-template-columns: 1fr;
      }

      .desktop-side .feedback {
        margin-top: 16px;
      }

      .game-over {
        grid-column: 1 / -1;
      }
    }

    @media (max-width: 900px) {

      .hamburger { display: block; }

      .nav-links.open li { width: 100%; }
      .nav-links.open a {
        display: block;
        width: 100%;
        padding: 14px 4px;
        border-bottom: 1px solid rgba(79, 134, 179, 0.10);
      }
    }

    @media (max-width: 620px) {
      .page { padding: 108px 14px 38px; }
      nav { padding: 0.95rem 1rem; }
      .nav-logo { font-size: 1.1rem; }
      .nav-links.open { top: 58px; padding-left: 1rem; padding-right: 1rem; }

      h1 { font-size: 50px; }

      .game-topbar {
        grid-template-columns: 1fr 1fr;
      }

      .game-topbar .stat:last-child {
        grid-column: 1 / -1;
      }

      .game-content { padding: 18px; }

      .country-card {
        min-height: 210px;
        padding: 20px;
      }

      .country-name {
        font-size: 48px;
      }

      .answers { grid-template-columns: 1fr; }

      .answer {
        min-height: 58px;
        text-align: center;
      }

</head>

    const countryNameEl = document.getElementById("countryName");
    const answersEl = document.getElementById("answers");
    const scoreEl = document.getElementById("score");
    const highScoreEl = document.getElementById("highScore");
    const timerEl = document.getElementById("timer");
    const feedbackEl = document.getElementById("feedback");
    const nextBtn = document.getElementById("nextBtn");
    const restartBtn = document.getElementById("restartBtn");
    const gameOverEl = document.getElementById("gameOver");
    const finalScoreEl = document.getElementById("finalScore");
    const authLink = document.getElementById("authLink");

    let currentUser = null;
    let cloudHighScore = 0;

    let score = 0;
    let timeLeft = 120;
    let timerInterval = null;
    let timerStarted = false;
    let currentQuestion = null;
    let answered = false;
    let deck = [];

    let highScore = Number(localStorage.getItem("capitalGameHighScore") || 0);
    highScoreEl.textContent = highScore;

    async function loadCloudHighScore(user) {
      if (!user) return;

      try {
        const scoreRef = doc(db, "leaderboards", "capital", "scores", user.uid);
        const snap = await getDoc(scoreRef);

        if (snap.exists()) {
          cloudHighScore = Number(snap.data().score || 0);

          if (cloudHighScore > highScore) {
            highScore = cloudHighScore;
            localStorage.setItem("capitalGameHighScore", String(highScore));
            highScoreEl.textContent = highScore;
          }
        }
      } catch (error) {
        console.error("Could not load community high score:", error);
      }
    }

    async function saveCloudHighScore() {
      if (!currentUser || score <= cloudHighScore) return;

      try {
        const scoreRef = doc(db, "leaderboards", "capital", "scores", currentUser.uid);
        const existingSnap = await getDoc(scoreRef);
        const existingScore = existingSnap.exists()
          ? Number(existingSnap.data().score || 0)
          : 0;

        if (score <= existingScore) {
          cloudHighScore = existingScore;
          return;
        }

        const displayName =
          currentUser.displayName ||
          currentUser.email?.split("@")[0] ||
          "Player";

        await setDoc(scoreRef, {
          uid: currentUser.uid,
          displayName,
          photoURL: currentUser.photoURL || "",
          score,
          updatedAt: serverTimestamp()
        });

        cloudHighScore = score;
      } catch (error) {
        console.error("Could not save community high score:", error);
      }
    }

    function shuffle(array) {
      const copy = [...array];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function resetDeck() {
      // Endless mode: after every country has appeared, reshuffle the full set
      // and continue. The only game-over condition is reaching 3 strikes.
      deck = shuffle(questions);
    }

    function formatTime(seconds) {
      const safe = Math.max(0, seconds);
      const minutes = Math.floor(safe / 60);
      const remaining = safe % 60;
      return `${minutes}:${String(remaining).padStart(2, "0")}`;
    }

    function updateTimer() {
      timerEl.textContent = formatTime(timeLeft);
    }

    function stopTimer() {
      if (timerInterval) {
        clearInterval(timerInterval);
        timerInterval = null;
      }
    }

    function startTimer() {
      stopTimer();
      updateTimer();

      timerInterval = setInterval(() => {
        timeLeft -= 1;
        updateTimer();

        if (timeLeft <= 0) {
          stopTimer();
          endGame();
        }
      }, 1000);
    }

    function subtractTime(seconds) {
      timeLeft = Math.max(0, timeLeft - seconds);
      updateTimer();

      if (timeLeft <= 0) {
        stopTimer();
        setTimeout(endGame, 350);
      }
    }

    function updateHighScore() {
      if (score > highScore) {
        highScore = score;
        localStorage.setItem("capitalGameHighScore", String(highScore));
        highScoreEl.textContent = highScore;
      }

      if (currentUser && score > cloudHighScore) {
        saveCloudHighScore();
      }
    }

    function loadQuestion() {
      answered = false;
      feedbackEl.textContent = "";
      nextBtn.style.display = "none";
      gameOverEl.style.display = "none";

      if (!deck.length) resetDeck();
      currentQuestion = deck.pop();
      countryNameEl.textContent = currentQuestion.country;

      answersEl.innerHTML = "";
      shuffle(currentQuestion.choices).forEach(choice => {
        const btn = document.createElement("button");
        btn.className = "answer";
        btn.type = "button";
        btn.textContent = choice;
        btn.addEventListener("click", () => chooseAnswer(btn, choice));
        answersEl.appendChild(btn);
      });
    }

    function chooseAnswer(button, choice) {
      if (answered) return;
      answered = true;

      if (!timerStarted) {
        timerStarted = true;
        startTimer();
      }

      const buttons = [...answersEl.querySelectorAll(".answer")];
      buttons.forEach(btn => btn.disabled = true);

      if (choice === currentQuestion.capital) {
        score += 1;
        scoreEl.textContent = score;
        button.classList.add("correct");
        feedbackEl.textContent = "Correct! +1";
        updateHighScore();
      } else {
        button.classList.add("wrong");
        const correctBtn = buttons.find(btn => btn.textContent === currentQuestion.capital);
        if (correctBtn) correctBtn.classList.add("correct");
        subtractTime(5);
        feedbackEl.textContent = `The capital is ${currentQuestion.capital}. −5 seconds`;
      }

      if (timeLeft > 0) {
        nextBtn.style.display = "block";
      }
    }

    function endGame() {
      stopTimer();
      answersEl.style.display = "none";
      feedbackEl.style.display = "none";
      nextBtn.style.display = "none";
      document.querySelector(".country-card").style.display = "none";
      document.querySelector(".prompt").style.display = "none";

      finalScoreEl.textContent = score;
      gameOverEl.style.display = "block";
      restartBtn.style.display = "block";
      updateHighScore();
    }

    function restartGame() {
      score = 0;
      timeLeft = 120;
      timerStarted = false;
      stopTimer();
      scoreEl.textContent = "0";
      updateTimer();

      answersEl.style.display = "grid";
      feedbackEl.style.display = "grid";
      document.querySelector(".country-card").style.display = "grid";
      document.querySelector(".prompt").style.display = "block";
      restartBtn.style.display = "none";

      resetDeck();
      loadQuestion();
    }

    nextBtn.addEventListener("click", loadQuestion);
    restartBtn.addEventListener("click", restartGame);

    const ham = document.getElementById("ham");
    const navMenu = document.getElementById("navMenu");

    ham.addEventListener("click", () => {
      navMenu.classList.toggle("open");
      ham.setAttribute("aria-expanded", navMenu.classList.contains("open"));
    });

    window.addEventListener("scroll", () => {
      document.getElementById("nav").classList.toggle("scrolled", window.scrollY > 10);
    });

    onAuthStateChanged(auth, async user => {
      currentUser = user;

      if (user) {
        const firstName =
          (user.displayName || user.email || "Account")
            .split(" ")[0]
            .split("@")[0];

        authLink.textContent = `Hi, ${firstName}`;
        authLink.href = "signin.html";

        await loadCloudHighScore(user);
      } else {
        cloudHighScore = 0;
        authLink.textContent = "Sign in";
        authLink.href = "signin.html?redirect=capitals.html";
      }
    });

    updateTimer();
    resetDeck();
    loadQuestion();
