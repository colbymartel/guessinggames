<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Name Hall of Fame</title>
  <style>
    :root {
      --brand: #4f86b3;
      --brand-dark: #376f9c;
      --bg: #f6f9fc;
      --ink: #172331;
      --muted: #66788a;
      --line: #dbe6ef;
      --soft: #edf4fa;
      --white: #ffffff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .page {
      width: min(100%, 1160px);
      margin: 0 auto;
      padding: 28px 24px 64px;
    }

    nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 28px;
      border-bottom: 1px solid var(--line);
    }

    .logo {
      font-size: 18px;
      letter-spacing: -0.04em;
      font-weight: 800;
    }

    .links {
      display: flex;
      align-items: center;
      gap: 24px;
      color: var(--muted);
      font-size: 14px;
      font-weight: 600;
    }

    .nav-btn {
      color: var(--ink);
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 9px 14px;
      background: var(--white);
    }

    .hero {
      display: grid;
      justify-items: center;
      text-align: center;
      gap: 16px;
      padding: 64px 0 38px;
    }

    .eyebrow {
      color: var(--brand);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      max-width: 880px;
      font-size: clamp(46px, 8vw, 92px);
      line-height: 0.94;
      letter-spacing: -0.08em;
      font-weight: 850;
    }

    .subhead {
      margin: 0;
      max-width: 600px;
      color: var(--muted);
      font-size: 18px;
      line-height: 1.5;
    }

    .hof-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 18px;
      align-items: stretch;
    }

    .hof-card {
      position: relative;
      min-height: 240px;
      padding: 18px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      background: var(--white);
      border: 1px solid var(--line);
      border-radius: 24px;
      box-shadow: 0 18px 42px rgba(23, 35, 49, 0.07);
    }

    .hof-card.featured {
      background:
        radial-gradient(circle at 50% 18%, rgba(79, 134, 179, 0.16), transparent 34%),
        var(--white);
      border-color: rgba(79, 134, 179, 0.34);
    }

    .week {
      color: var(--brand);
      font-size: 12px;
      font-weight: 850;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .display {
      display: grid;
      place-items: center;
      width: 100%;
      aspect-ratio: 1 / 1;
      margin: 18px 0;
      border-radius: 20px;
      background:
        linear-gradient(135deg, rgba(79, 134, 179, 0.12), rgba(255, 255, 255, 0.9)),
        var(--soft);
      border: 1px solid var(--line);
    }

    .trophy {
      font-size: 48px;
      line-height: 1;
    }

    .lock {
      display: grid;
      place-items: center;
      width: 62px;
      height: 62px;
      border-radius: 999px;
      background: var(--white);
      border: 1px solid var(--line);
      color: var(--muted);
      font-size: 28px;
      box-shadow: 0 12px 28px rgba(23, 35, 49, 0.06);
    }

    .entry-name {
      margin: 0;
      font-size: 30px;
      line-height: 1;
      letter-spacing: -0.07em;
      font-weight: 850;
    }

    .entry-meta {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.4;
      font-weight: 550;
    }

    .locked {
      background:
        linear-gradient(135deg, rgba(255, 255, 255, 0.9), rgba(237, 244, 250, 0.72)),
        var(--white);
    }

    .locked .entry-name,
    .locked .week {
      color: var(--muted);
    }

    .cta {
      display: flex;
      justify-content: center;
      margin-top: 28px;
    }

    .cta a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 50px;
      padding: 0 22px;
      border-radius: 999px;
      background: var(--brand);
      color: white;
      font-size: 15px;
      font-weight: 780;
    }

    .hero-actions {
  display: flex;
  justify-content: center;
  margin-top: 10px;
}

.vote-link {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-height: 52px;
  padding: 0 24px;
  border-radius: 999px;
  background: var(--brand);
  color: white;
  font-size: 15px;
  font-weight: 780;
  box-shadow: 0 14px 28px rgba(79, 134, 179, 0.18);
  transition: transform 0.16s ease, background 0.16s ease;
}

.vote-link:hover {
  background: var(--brand-dark);
  transform: translateY(-2px);
}

    @media (max-width: 980px) {
      .hof-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 620px) {
      .page {
        padding: 22px 16px 44px;
      }

      nav {
        align-items: flex-start;
      }

      .links {
        display: none;
      }

      .hero {
        padding: 48px 0 30px;
      }

      .hof-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <nav>
      <a class="logo" href="name-hall-of-fame-ballot.html">Guessing Games</a>

      <div class="links">
        <a href="index.html">Games</a>
        <a href="halloffame.html">Hall of Fame</a>
        <a href="live.html">Live Shows</a>
        <a href="about.html">About</a>
        <a class="nav-btn" href="#">Sign in</a>
      </div>
    </nav>

    <section class="hero">
      <div class="eyebrow">Official archive</div>
      <h1>Name Hall of Fame</h1>
    </section>

    <section class="hof-grid" aria-label="Weekly Hall of Fame entries">
      <article class="hof-card featured">
        <div>
          <div class="week">Week 1</div>
          <div class="display">
            <div class="lock" aria-hidden="true">🔒</div>
          </div>
        </div>
  
      </article>

      <article class="hof-card locked">
        <div>
          <div class="week">Week 2</div>
          <div class="display">
            <div class="lock" aria-hidden="true">🔒</div>
          </div>
        </div>
      </article>

      <article class="hof-card locked">
        <div>
          <div class="week">Week 3</div>
          <div class="display">
            <div class="lock" aria-hidden="true">🔒</div>
          </div>
        </div>
      </article>

      <article class="hof-card locked">
        <div>
          <div class="week">Week 4</div>
          <div class="display">
            <div class="lock" aria-hidden="true">🔒</div>
          </div>
        </div>
      </article>

      <article class="hof-card locked">
        <div>
          <div class="week">Week 5</div>
          <div class="display">
            <div class="lock" aria-hidden="true">🔒</div>
          </div>
        </div>
      </article>
    </section>

    <div class="cta">
      <a href="vote.html">Vote on this week’s ballot</a>
    </div>
  </main>
</body>
</html>
