<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign in | Guessing Games</title>
  <link rel="icon" href="/favicongg.ico" />
  <style>
    :root {
      --brand: #4f86b3;
      --brand-dark: #376f9c;
      --bg: #f6f9fc;
      --ink: #172331;
      --muted: #66788a;
      --line: #dbe6ef;
      --soft: #edf4fa;
      --white: #ffffff;
      --danger: #b42318;
      --success: #1f7a4d;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    a { color: inherit; text-decoration: none; }
    button, input { font: inherit; }
    .page { width: min(100%, 1180px); margin: 0 auto; padding: 28px 24px 56px; }
    nav { display: flex; align-items: center; justify-content: space-between; padding-bottom: 28px; border-bottom: 1px solid var(--line); }
    .logo { font-size: 18px; letter-spacing: -0.04em; font-weight: 800; }
    .links { display: flex; align-items: center; gap: 24px; color: var(--muted); font-size: 14px; font-weight: 600; }
    .links a:hover { color: var(--ink); }
    .nav-btn { color: var(--ink); border: 1px solid var(--line); border-radius: 999px; padding: 9px 14px; background: var(--white); }
    .auth-wrap { min-height: calc(100vh - 120px); display: grid; place-items: center; padding: 54px 0; }
    .auth-card {
      width: min(100%, 490px);
      background: var(--white);
      border: 1px solid var(--line);
      border-radius: 24px;
      padding: 28px;
      box-shadow: 0 18px 40px rgba(23, 35, 49, 0.05);
    }
    .eyebrow { color: var(--brand); font-size: 12px; font-weight: 800; letter-spacing: 0.16em; text-transform: uppercase; text-align: center; margin-bottom: 14px; }
    h1 { margin: 0; font-size: clamp(46px, 9vw, 76px); line-height: 0.9; letter-spacing: -0.085em; font-weight: 880; text-align: center; }
    .subhead { margin: 14px auto 24px; max-width: 360px; color: var(--muted); font-size: 16px; line-height: 1.5; text-align: center; }
    .google-btn, .primary-btn, .secondary-btn {
      width: 100%;
      min-height: 52px;
      border-radius: 999px;
      border: 1px solid var(--line);
      font-weight: 800;
      cursor: pointer;
      transition: transform .16s ease, border-color .16s ease, background .16s ease;
    }
    .google-btn { background: var(--white); color: var(--ink); }
    .primary-btn { background: var(--brand); border-color: var(--brand); color: white; margin-top: 14px; box-shadow: 0 14px 28px rgba(79, 134, 179, 0.18); }
    .secondary-btn { background: var(--white); color: var(--ink); margin-top: 10px; }
    .google-btn:hover, .primary-btn:hover, .secondary-btn:hover { transform: translateY(-2px); border-color: var(--brand); }
    .primary-btn:hover { background: var(--brand-dark); }
    .divider { display: flex; align-items: center; gap: 12px; color: var(--muted); font-size: 12px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; margin: 22px 0; }
    .divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: var(--line); }
    .tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; background: var(--soft); border: 1px solid var(--line); border-radius: 999px; padding: 6px; margin-bottom: 16px; }
    .tab { border: 0; border-radius: 999px; min-height: 40px; background: transparent; color: var(--muted); font-size: 14px; font-weight: 800; cursor: pointer; }
    .tab.active { background: var(--white); color: var(--ink); box-shadow: 0 8px 20px rgba(23, 35, 49, 0.06); }
    .field { display: grid; gap: 8px; margin-top: 12px; }
    label { color: var(--ink); font-size: 13px; font-weight: 800; }
    input { width: 100%; border: 1px solid var(--line); border-radius: 16px; background: var(--white); color: var(--ink); padding: 14px 15px; outline: none; font-size: 15px; }
    input:focus { border-color: var(--brand); box-shadow: 0 0 0 4px rgba(79, 134, 179, 0.12); }
    .message { min-height: 22px; margin-top: 16px; color: var(--muted); font-size: 14px; line-height: 1.4; text-align: center; font-weight: 650; }
    .message.error { color: var(--danger); }
    .message.success { color: var(--success); }
    .message a {
      color: var(--brand-dark);
      font-weight: 850;
      text-decoration: underline;
      text-underline-offset: 3px;
    }
    .profile { display: none; margin-top: 18px; padding: 16px; border-radius: 18px; background: var(--soft); border: 1px solid var(--line); text-align: center; }
    .profile img { width: 58px; height: 58px; border-radius: 999px; object-fit: cover; background: var(--white); border: 1px solid var(--line); margin-bottom: 8px; }
    .profile strong { display: block; font-size: 15px; }
    .profile span { display: block; color: var(--muted); font-size: 13px; margin-top: 4px; word-break: break-word; }
    @media (max-width: 620px) {
      .page { padding: 22px 16px 44px; }
      .links { display: none; }
      .auth-card { padding: 22px; }
    }
  </style>
</head>
<body>
  <main class="page">
    <nav aria-label="Primary">
      <a class="logo" href="index.html">Guessing Games</a>
      <div class="links">
        <a href="index.html">Games</a>
        <a href="halloffame.html">Hall of Fame</a>
        <a href="live.html">Live</a>
        <a href="about.html">About</a>
        <a class="nav-btn" href="signin.html">Sign in</a>
      </div>
    </nav>

    <section class="auth-wrap">
      <div class="auth-card">
        <h1>Sign in</h1>
        <p class="subhead">Create an account or log in.</p>

        <button class="google-btn" id="googleBtn">Continue with Google</button>

        <div class="divider">or</div>

        <div class="tabs" aria-label="Authentication mode">
          <button class="tab active" id="loginTab" type="button">Log in</button>
          <button class="tab" id="createTab" type="button">Create account</button>
        </div>

        <form id="emailForm">
          <div class="field">
            <label for="email">Email</label>
            <input id="email" type="email" autocomplete="email" required placeholder="you@example.com">
          </div>
          <div class="field">
            <label for="password">Password</label>
            <input id="password" type="password" autocomplete="current-password" required placeholder="At least 6 characters">
          </div>
          <button class="primary-btn" id="emailSubmitBtn" type="submit">Log in</button>
        </form>

        <button class="secondary-btn" id="signOutBtn" style="display:none;" type="button">Sign out</button>

        <div class="profile" id="profile">
          <img id="userPhoto" alt="">
          <strong id="userName"></strong>
          <span id="userEmail"></span>
        </div>

        <div class="message" id="message"></div>
      </div>
    </section>
  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
    import {
      getAuth,
      GoogleAuthProvider,
      signInWithPopup,
      createUserWithEmailAndPassword,
      signInWithEmailAndPassword,
      sendPasswordResetEmail,
      signOut,
      updateProfile,
      onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyB-N0Y02yh3xoXSPu6XsqSZGP3m0ZxprpI",
      authDomain: "guessinggames.firebaseapp.com",
      projectId: "guessinggames",
      storageBucket: "guessinggames.firebasestorage.app",
      messagingSenderId: "431644741449",
      appId: "1:431644741449:web:0b699b3acdec1f95b19498"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const provider = new GoogleAuthProvider();

    const googleBtn = document.getElementById("googleBtn");
    const signOutBtn = document.getElementById("signOutBtn");
    const emailForm = document.getElementById("emailForm");
    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");
    const emailSubmitBtn = document.getElementById("emailSubmitBtn");
    const loginTab = document.getElementById("loginTab");
    const createTab = document.getElementById("createTab");
    const messageEl = document.getElementById("message");
    const profileEl = document.getElementById("profile");
    const userPhoto = document.getElementById("userPhoto");
    const userName = document.getElementById("userName");
    const userEmail = document.getElementById("userEmail");

    let mode = "login";

    function setMessage(text, type = "") {
      messageEl.textContent = text;
      messageEl.className = "message" + (type ? " " + type : "");
    }

    function setMode(nextMode) {
      mode = nextMode;
      const isCreate = mode === "create";
      loginTab.classList.toggle("active", !isCreate);
      createTab.classList.toggle("active", isCreate);
      emailSubmitBtn.textContent = isCreate ? "Create account" : "Log in";
      passwordInput.autocomplete = isCreate ? "new-password" : "current-password";
      setMessage("");
    }

    function getRedirectTarget() {
      const params = new URLSearchParams(window.location.search);
      return params.get("redirect") || "vote.html";
    }

    function redirectAfterAuth() {
      window.location.href = getRedirectTarget();
    }

    function setMessageHTML(html, type = "") {
      messageEl.innerHTML = html;
      messageEl.className = "message" + (type ? " " + type : "");
    }

    function showNoAccountMessage() {
      setMessageHTML(
        `No account found. <a href="#" id="switchToCreate">Sign up</a> or <a href="#" id="forgotPassword">Forgot password?</a>`,
        "error"
      );

      document.getElementById("switchToCreate")?.addEventListener("click", (event) => {
        event.preventDefault();
        setMode("create");
        passwordInput.focus();
      });

      document.getElementById("forgotPassword")?.addEventListener("click", async (event) => {
        event.preventDefault();

        const email = emailInput.value.trim();

        if (!email) {
          setMessage("Enter your email first, then click Forgot password.", "error");
          emailInput.focus();
          return;
        }

        try {
          await sendPasswordResetEmail(auth, email);
          setMessage("Password reset email sent. Check your inbox.", "success");
        } catch {
          setMessage("Could not send password reset. Make sure the email is valid.", "error");
        }
      });
    }

    function readableAuthError(error) {
      const code = error?.code || "";

      const messages = {
        "auth/email-already-in-use": "That email already has an account. Try logging in instead.",
        "auth/invalid-email": "Please enter a valid email address.",
        "auth/missing-email": "Please enter your email address.",
        "auth/missing-password": "Please enter a password.",
        "auth/weak-password": "Password should be at least 6 characters.",
        "auth/wrong-password": "Incorrect password.",
        "auth/popup-closed-by-user": "The Google sign-in popup was closed.",
        "auth/network-request-failed": "Network error. Please check your connection and try again.",
        "auth/too-many-requests": "Too many attempts. Please wait a minute and try again.",
        "auth/operation-not-allowed": "Email/password accounts are not enabled yet. Enable Email/Password in Firebase Authentication.",
        "auth/admin-restricted-operation": "Email/password accounts are not enabled yet. Enable Email/Password in Firebase Authentication."
      };

      if (code === "auth/user-not-found" || code === "auth/invalid-credential") {
        return "NO_ACCOUNT";
      }

      return messages[code] || "Something went wrong. Please try again.";
    }

    loginTab.addEventListener("click", () => setMode("login"));
    createTab.addEventListener("click", () => setMode("create"));

    googleBtn.addEventListener("click", async () => {
      try {
        setMessage("Opening Google sign in...");
        await signInWithPopup(auth, provider);
        setMessage("Signed in. Redirecting...", "success");
        setTimeout(redirectAfterAuth, 500);
      } catch (error) {
        console.error("Google auth error:", error);
        const friendlyError = readableAuthError(error);
        setMessage(friendlyError === "NO_ACCOUNT" ? "Could not sign in with Google. Please try again." : friendlyError, "error");
      }
    });

    emailForm.addEventListener("submit", async (event) => {
      event.preventDefault();
      const email = emailInput.value.trim();
      const password = passwordInput.value;
      try {
        emailSubmitBtn.disabled = true;
        setMessage(mode === "create" ? "Creating account..." : "Logging in...");
        if (mode === "create") {
          const userCredential = await createUserWithEmailAndPassword(auth, email, password);
          await updateProfile(userCredential.user, { displayName: email.split("@")[0] });
        } else {
          await signInWithEmailAndPassword(auth, email, password);
        }
        setMessage("Signed in. Redirecting...", "success");
        setTimeout(redirectAfterAuth, 500);
      } catch (error) {
        console.error("Auth error:", error);

        const friendlyError = readableAuthError(error);

        if (mode === "login" && friendlyError === "NO_ACCOUNT") {
          showNoAccountMessage();
        } else if (mode === "create" && friendlyError === "NO_ACCOUNT") {
          setMessage("Could not create account. Please check your email and password.", "error");
        } else {
          setMessage(friendlyError, "error");
        }
      } finally {
        emailSubmitBtn.disabled = false;
      }
    });

    signOutBtn.addEventListener("click", async () => {
      await signOut(auth);
      setMessage("Signed out.", "success");
    });

    onAuthStateChanged(auth, (user) => {
      const divider = document.querySelector(".divider");
      const tabs = document.querySelector(".tabs");
      if (user) {
        googleBtn.style.display = "none";
        emailForm.style.display = "none";
        divider.style.display = "none";
        tabs.style.display = "none";
        signOutBtn.style.display = "block";
        profileEl.style.display = "block";
        userPhoto.src = user.photoURL || "";
        userPhoto.style.display = user.photoURL ? "inline-block" : "none";
        userName.textContent = user.displayName || "Signed in user";
        userEmail.textContent = user.email || "";
      } else {
        googleBtn.style.display = "block";
        emailForm.style.display = "block";
        divider.style.display = "flex";
        tabs.style.display = "grid";
        signOutBtn.style.display = "none";
        profileEl.style.display = "none";
      }
    });
  </script>
</body>
</html>
