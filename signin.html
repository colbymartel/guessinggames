<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  />

  <title>Sign In | Guessing Games</title>

  <style>
    :root {
      --brand: #4f86b3;
      --brand-dark: #376f9c;
      --brand-soft: #eaf2f8;
      --bg: #f6f9fc;
      --ink: #172331;
      --muted: #66788a;
      --line: #dbe6ef;
      --white: #ffffff;
      --danger: #b42318;
      --danger-soft: #fef0ee;
      --success: #1f7a4d;
      --success-soft: #edf8f2;
      --shadow: 0 24px 70px rgba(23, 35, 49, 0.11);
    }

    * {
      box-sizing: border-box;
    }

    html {
      -webkit-text-size-adjust: 100%;
    }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      color: var(--ink);
      background:
        radial-gradient(
          circle at 50% 0%,
          rgba(79, 134, 179, 0.14),
          transparent 36%
        ),
        var(--bg);
      font-family:
        Inter,
        ui-sans-serif,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button,
    input {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    button,
    input,
    a {
      -webkit-tap-highlight-color: transparent;
    }

    .page {
      width: min(100%, 1120px);
      min-height: 100vh;
      min-height: 100dvh;
      margin: 0 auto;
      padding:
        max(22px, env(safe-area-inset-top))
        max(18px, env(safe-area-inset-right))
        max(36px, env(safe-area-inset-bottom))
        max(18px, env(safe-area-inset-left));
    }

    nav {
      min-height: 54px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      padding-bottom: 22px;
      border-bottom: 1px solid var(--line);
    }

    .logo {
      font-size: 18px;
      font-weight: 850;
      letter-spacing: -0.045em;
    }

    .back-link {
      min-height: 42px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0 15px;
      color: var(--muted);
      background: rgba(255, 255, 255, 0.78);
      border: 1px solid var(--line);
      border-radius: 999px;
      font-size: 14px;
      font-weight: 700;
    }

    .back-link:hover {
      color: var(--ink);
      background: var(--white);
    }

    .auth-layout {
      min-height: calc(100vh - 100px);
      min-height: calc(100dvh - 100px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 50px 20px;
    }

    .auth-card {
      width: min(100%, 480px);
      padding: 34px;
      background: rgba(255, 255, 255, 0.97);
      border: 1px solid var(--line);
      border-radius: 28px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(12px);
    }

    .card-heading {
      margin-bottom: 24px;
      text-align: center;
    }

    .card-heading h1 {
      margin: 0;
      font-size: 36px;
      line-height: 1;
      letter-spacing: -0.06em;
    }

    .card-heading p {
      margin: 12px auto 0;
      max-width: 330px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.5;
    }

    .tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 5px;
      margin-bottom: 22px;
      padding: 5px;
      background: var(--brand-soft);
      border-radius: 14px;
    }

    .tab {
      min-height: 43px;
      padding: 8px 12px;
      color: var(--muted);
      background: transparent;
      border: 0;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 760;
    }

    .tab.active {
      color: var(--ink);
      background: var(--white);
      box-shadow: 0 3px 10px rgba(23, 35, 49, 0.08);
    }

    .google-button {
      width: 100%;
      min-height: 54px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 12px 18px;
      color: var(--ink);
      background: var(--white);
      border: 1px solid var(--line);
      border-radius: 999px;
      box-shadow: 0 7px 20px rgba(23, 35, 49, 0.06);
      font-size: 15px;
      font-weight: 760;
      transition:
        transform 0.16s ease,
        border-color 0.16s ease,
        box-shadow 0.16s ease;
    }

    .google-button:hover:not(:disabled) {
      transform: translateY(-2px);
      border-color: var(--brand);
      box-shadow: 0 12px 28px rgba(79, 134, 179, 0.16);
    }

    .google-icon {
      width: 21px;
      height: 21px;
      flex: 0 0 auto;
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 22px 0;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .divider::before,
    .divider::after {
      content: "";
      height: 1px;
      flex: 1;
      background: var(--line);
    }

    .form {
      display: grid;
      gap: 15px;
    }

    .field {
      display: grid;
      gap: 7px;
    }

    .field label {
      padding-left: 2px;
      color: var(--ink);
      font-size: 13px;
      font-weight: 750;
    }

    .field input {
      width: 100%;
      min-height: 52px;
      padding: 12px 15px;
      color: var(--ink);
      background: var(--white);
      border: 1px solid var(--line);
      border-radius: 13px;
      outline: none;
      font-size: 16px;
      transition:
        border-color 0.16s ease,
        box-shadow 0.16s ease;
    }

    .field input::placeholder {
      color: #96a5b3;
    }

    .field input:focus {
      border-color: var(--brand);
      box-shadow: 0 0 0 4px rgba(79, 134, 179, 0.14);
    }

    .password-wrap {
      position: relative;
    }

    .password-wrap input {
      padding-right: 68px;
    }

    .show-password {
      position: absolute;
      top: 50%;
      right: 9px;
      min-width: 52px;
      min-height: 36px;
      padding: 0 8px;
      color: var(--brand-dark);
      background: transparent;
      border: 0;
      border-radius: 8px;
      transform: translateY(-50%);
      font-size: 12px;
      font-weight: 800;
    }

    .show-password:hover {
      background: var(--brand-soft);
    }

    .form-row {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      margin-top: -4px;
    }

    .forgot-button {
      padding: 3px 0;
      color: var(--brand-dark);
      background: transparent;
      border: 0;
      font-size: 13px;
      font-weight: 750;
    }

    .forgot-button:hover {
      text-decoration: underline;
    }

    .marketing-consent {
      margin-top: 2px;
      padding: 13px;
      background: #f8fbfd;
      border: 1px solid var(--line);
      border-radius: 13px;
    }

    .checkbox-row {
      display: grid;
      grid-template-columns: 22px minmax(0, 1fr);
      align-items: start;
      gap: 11px;
      cursor: pointer;
    }

    .checkbox-row input {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      opacity: 0;
      pointer-events: none;
    }

    .custom-checkbox {
      width: 22px;
      height: 22px;
      display: grid;
      place-items: center;
      margin-top: 1px;
      background: var(--white);
      border: 1.5px solid var(--line);
      border-radius: 6px;
      transition:
        background 0.16s ease,
        border-color 0.16s ease,
        box-shadow 0.16s ease;
    }

    .checkbox-row input:checked + .custom-checkbox {
      background: var(--brand);
      border-color: var(--brand);
    }

    .checkbox-row input:checked + .custom-checkbox::after {
      content: "✓";
      color: var(--white);
      font-size: 14px;
      font-weight: 900;
    }

    .checkbox-row input:focus-visible + .custom-checkbox {
      border-color: var(--brand);
      box-shadow: 0 0 0 4px rgba(79, 134, 179, 0.14);
    }

    .checkbox-copy {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
    }

    .submit-button,
    .continue-button,
    .signout-button,
    .resend-button {
      width: 100%;
      min-height: 54px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px 18px;
      border-radius: 999px;
      font-size: 16px;
      font-weight: 780;
    }

    .submit-button,
    .continue-button {
      color: var(--white);
      background: var(--brand);
      border: 0;
    }

    .submit-button:hover:not(:disabled),
    .continue-button:hover {
      background: var(--brand-dark);
    }

    .submit-button {
      margin-top: 3px;
    }

    .submit-button:disabled,
    .google-button:disabled,
    .signout-button:disabled,
    .resend-button:disabled,
    .forgot-button:disabled {
      cursor: wait;
      opacity: 0.55;
      transform: none;
    }

    .terms {
      margin: 18px 0 0;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.55;
      text-align: center;
    }

    .message {
      display: none;
      margin-top: 18px;
      padding: 12px 14px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 650;
      line-height: 1.5;
      text-align: center;
    }

    .message.show {
      display: block;
    }

    .message.error {
      color: var(--danger);
      background: var(--danger-soft);
    }

    .message.success {
      color: var(--success);
      background: var(--success-soft);
    }

    .message.info {
      color: var(--brand-dark);
      background: var(--brand-soft);
    }

    .signed-in-view {
      display: none;
      text-align: center;
    }

    .signed-in-view.show {
      display: block;
    }

    .avatar,
    .avatar-placeholder {
      width: 80px;
      height: 80px;
      margin: 0 auto 17px;
      border-radius: 50%;
    }

    .avatar {
      display: block;
      object-fit: cover;
      border: 4px solid var(--brand-soft);
    }

    .avatar-placeholder {
      display: grid;
      place-items: center;
      color: var(--white);
      background: var(--brand);
      font-size: 27px;
      font-weight: 850;
    }

    .profile-name {
      margin: 0;
      font-size: 27px;
      line-height: 1.1;
      letter-spacing: -0.045em;
    }

    .profile-email {
      margin: 8px 0 8px;
      color: var(--muted);
      font-size: 14px;
      overflow-wrap: anywhere;
    }

    .verification-status {
      width: fit-content;
      margin: 0 auto 24px;
      padding: 6px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 750;
    }

    .verification-status.verified {
      color: var(--success);
      background: var(--success-soft);
    }

    .verification-status.unverified {
      color: var(--danger);
      background: var(--danger-soft);
    }

    .continue-button {
      margin-bottom: 11px;
    }

    .resend-button {
      margin-bottom: 11px;
      color: var(--brand-dark);
      background: var(--brand-soft);
      border: 0;
    }

    .resend-button:hover:not(:disabled) {
      background: #dcebf6;
    }

    .signout-button {
      color: var(--muted);
      background: transparent;
      border: 1px solid var(--line);
    }

    .signout-button:hover:not(:disabled) {
      color: var(--ink);
      background: var(--brand-soft);
    }

    .hidden {
      display: none !important;
    }

    @media (max-width: 560px) {
      .page {
        padding-top: max(16px, env(safe-area-inset-top));
      }

      nav {
        min-height: 48px;
        padding-bottom: 16px;
      }

      .logo {
        font-size: 17px;
      }

      .back-link {
        min-height: 38px;
        padding: 0 13px;
        font-size: 13px;
      }

      .auth-layout {
        min-height: calc(100dvh - 84px);
        padding: 28px 0 16px;
      }

      .auth-card {
        width: 100%;
        padding: 25px 18px;
        border-radius: 22px;
        box-shadow: 0 18px 45px rgba(23, 35, 49, 0.1);
      }

      .card-heading {
        margin-bottom: 20px;
      }

      .card-heading h1 {
        font-size: 31px;
      }

      .field input {
        min-height: 51px;
      }

      .google-button,
      .submit-button,
      .continue-button,
      .signout-button,
      .resend-button {
        min-height: 52px;
      }

      .checkbox-copy {
        font-size: 11.5px;
      }
    }

    @media (max-width: 370px) {
      .auth-card {
        padding: 22px 14px;
      }

      .tabs {
        gap: 3px;
      }

      .tab {
        padding-left: 7px;
        padding-right: 7px;
        font-size: 13px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        transition: none !important;
      }
    }
    .verification-status,
.resend-button {
  display: none !important;
}
  </style>
</head>

<body>
  <main class="page">
    <nav>
      <a class="logo" href="index.html">
        Guessing Games
      </a>

      <a
        class="back-link"
        id="backLink"
        href="vote.html"
      >
        Back to voting
      </a>
    </nav>

    <section class="auth-layout">
      <div class="auth-card">
        <div id="authView">
          <div class="card-heading">
            <h1 id="formTitle">
              Welcome back
            </h1>

            <p id="formSubtitle">
              Sign in to continue to voting.
            </p>
          </div>

          <div class="tabs" role="tablist">
            <button
              class="tab active"
              id="signInTab"
              type="button"
              role="tab"
              aria-selected="true"
            >
              Sign in
            </button>

            <button
              class="tab"
              id="createTab"
              type="button"
              role="tab"
              aria-selected="false"
            >
              Create account
            </button>
          </div>

          <button
            class="google-button"
            id="googleButton"
            type="button"
          >
            <svg
              class="google-icon"
              viewBox="0 0 24 24"
              aria-hidden="true"
            >
              <path
                fill="#4285F4"
                d="M21.6 12.227c0-.709-.064-1.391-.182-2.045H12v3.868h5.382a4.6 4.6 0 0 1-1.995 3.018v2.509h3.232c1.891-1.741 2.981-4.305 2.981-7.35Z"
              />

              <path
                fill="#34A853"
                d="M12 22c2.7 0 4.968-.895 6.619-2.423l-3.232-2.509c-.895.6-2.041.955-3.387.955-2.605 0-4.809-1.759-5.596-4.123H3.064v2.591A9.997 9.997 0 0 0 12 22Z"
              />

              <path
                fill="#FBBC05"
                d="M6.404 13.9A6.014 6.014 0 0 1 6.091 12c0-.659.114-1.3.313-1.9V7.509h-3.34A10 10 0 0 0 2 12c0 1.614.386 3.141 1.064 4.491L6.404 13.9Z"
              />

              <path
                fill="#EA4335"
                d="M12 5.977c1.468 0 2.786.505 3.823 1.495l2.868-2.868C16.964 2.995 14.696 2 12 2a9.997 9.997 0 0 0-8.936 5.509l3.34 2.591C7.191 7.736 9.395 5.977 12 5.977Z"
              />
            </svg>

            <span id="googleButtonText">
              Continue with Google
            </span>
          </button>

          <div class="divider">
            or use email
          </div>

          <form
            class="form"
            id="emailForm"
            novalidate
          >
            <div
              class="field hidden"
              id="nameField"
            >
              <label for="displayName">
                First name
              </label>

              <input
                id="displayName"
                name="displayName"
                type="text"
                autocomplete="given-name"
                maxlength="40"
                placeholder="Your first name"
              />
            </div>

            <div class="field">
              <label for="email">
                Email address
              </label>

              <input
                id="email"
                name="email"
                type="email"
                autocomplete="email"
                inputmode="email"
                maxlength="254"
                placeholder="you@example.com"
                required
              />
            </div>

            <div class="field">
              <label for="password">
                Password
              </label>

              <div class="password-wrap">
                <input
                  id="password"
                  name="password"
                  type="password"
                  autocomplete="current-password"
                  minlength="6"
                  maxlength="128"
                  placeholder="Enter your password"
                  required
                />

                <button
                  class="show-password"
                  id="showPasswordButton"
                  type="button"
                  aria-label="Show password"
                >
                  Show
                </button>
              </div>
            </div>

            <div
              class="field hidden"
              id="confirmPasswordField"
            >
              <label for="confirmPassword">
                Confirm password
              </label>

              <div class="password-wrap">
                <input
                  id="confirmPassword"
                  name="confirmPassword"
                  type="password"
                  autocomplete="new-password"
                  minlength="6"
                  maxlength="128"
                  placeholder="Enter your password again"
                />

                <button
                  class="show-password"
                  id="showConfirmPasswordButton"
                  type="button"
                  aria-label="Show confirmation password"
                >
                  Show
                </button>
              </div>
            </div>

            <div
              class="form-row"
              id="forgotPasswordRow"
            >
              <button
                class="forgot-button"
                id="forgotPasswordButton"
                type="button"
              >
                Forgot password?
              </button>
            </div>

            <div
              class="marketing-consent hidden"
              id="marketingConsentField"
            >
              <label
                class="checkbox-row"
                for="marketingConsent"
              >
                <input
                  id="marketingConsent"
                  name="marketingConsent"
                  type="checkbox"
                />

                <span
                  class="custom-checkbox"
                  aria-hidden="true"
                ></span>

                <span class="checkbox-copy">
                  Email me occasional promotions, updates, and
                  Name Hall of Fame news. I can unsubscribe at
                  any time.
                </span>
              </label>
            </div>

            <button
              class="submit-button"
              id="submitButton"
              type="submit"
            >
              Sign in
            </button>
          </form>

          <p class="terms">
            Each account may vote once per round. Promotional
            emails are optional and require email verification.
          </p>
        </div>

        <div
          class="signed-in-view"
          id="signedInView"
        >
          <div id="profile"></div>

          <div
            class="verification-status"
            id="verificationStatus"
          ></div>

          <button
            class="resend-button hidden"
            id="resendVerificationButton"
            type="button"
          >
            Resend verification email
          </button>

          <a
            class="continue-button"
            id="continueButton"
            href="vote.html"
          >
            Continue to voting
          </a>

          <button
            class="signout-button"
            id="signoutButton"
            type="button"
          >
            Sign out
          </button>
        </div>

        <div
          class="message"
          id="message"
          role="status"
          aria-live="polite"
        ></div>
      </div>
    </section>
  </main>

  <script type="module">
    import {
      initializeApp
    } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";

    import {
      getAuth,
      GoogleAuthProvider,
      browserLocalPersistence,
      setPersistence,
      signInWithPopup,
      signInWithRedirect,
      getRedirectResult,
      signInWithEmailAndPassword,
      createUserWithEmailAndPassword,
      updateProfile,
      sendEmailVerification,
      sendPasswordResetEmail,
      onAuthStateChanged,
      signOut
    } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";

    import {
      getFirestore,
      doc,
      getDoc,
      setDoc,
      serverTimestamp
    } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyB-N0Y02yh3xoXSPu6XsqSZGP3m0ZxprpI",
      authDomain: "guessinggames.firebaseapp.com",
      projectId: "guessinggames",
      storageBucket: "guessinggames.firebasestorage.app",
      messagingSenderId: "431644741449",
      appId: "1:431644741449:web:0b699b3acdec1f95b19498"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const googleProvider = new GoogleAuthProvider();

    googleProvider.setCustomParameters({
      prompt: "select_account"
    });

    const authView =
      document.getElementById("authView");

    const signedInView =
      document.getElementById("signedInView");

    const profileEl =
      document.getElementById("profile");

    const verificationStatus =
      document.getElementById("verificationStatus");

    const messageEl =
      document.getElementById("message");

    const signInTab =
      document.getElementById("signInTab");

    const createTab =
      document.getElementById("createTab");

    const formTitle =
      document.getElementById("formTitle");

    const formSubtitle =
      document.getElementById("formSubtitle");

    const googleButton =
      document.getElementById("googleButton");

    const googleButtonText =
      document.getElementById("googleButtonText");

    const emailForm =
      document.getElementById("emailForm");

    const submitButton =
      document.getElementById("submitButton");

    const nameField =
      document.getElementById("nameField");

    const displayNameInput =
      document.getElementById("displayName");

    const emailInput =
      document.getElementById("email");

    const passwordInput =
      document.getElementById("password");

    const confirmPasswordField =
      document.getElementById("confirmPasswordField");

    const confirmPasswordInput =
      document.getElementById("confirmPassword");

    const forgotPasswordRow =
      document.getElementById("forgotPasswordRow");

    const forgotPasswordButton =
      document.getElementById("forgotPasswordButton");

    const marketingConsentField =
      document.getElementById("marketingConsentField");

    const marketingConsentInput =
      document.getElementById("marketingConsent");

    const showPasswordButton =
      document.getElementById("showPasswordButton");

    const showConfirmPasswordButton =
      document.getElementById(
        "showConfirmPasswordButton"
      );

    const continueButton =
      document.getElementById("continueButton");

    const signoutButton =
      document.getElementById("signoutButton");

    const resendVerificationButton =
      document.getElementById(
        "resendVerificationButton"
      );

    const backLink =
      document.getElementById("backLink");

    let authMode = "signin";
    let redirectInProgress = false;
    let accountCreationInProgress = false;

    function getSafeRedirect() {
      const params =
        new URLSearchParams(window.location.search);

      const requestedRedirect =
        params.get("redirect");

      if (!requestedRedirect) {
        return "vote.html";
      }

      try {
        const target = new URL(
          requestedRedirect,
          window.location.origin
        );

        if (target.origin !== window.location.origin) {
          return "vote.html";
        }

        return (
          target.pathname +
          target.search +
          target.hash
        );
      } catch {
        return "vote.html";
      }
    }

    const redirectTarget = getSafeRedirect();

    continueButton.href = redirectTarget;
    backLink.href = redirectTarget;

    function setMessage(
      text,
      type = "error"
    ) {
      messageEl.textContent = text;
      messageEl.className =
        `message show ${type}`;
    }

    function clearMessage() {
      messageEl.textContent = "";
      messageEl.className = "message";
    }

    function setBusy(
      isBusy,
      buttonText = ""
    ) {
      googleButton.disabled = isBusy;
      submitButton.disabled = isBusy;
      signoutButton.disabled = isBusy;
      resendVerificationButton.disabled = isBusy;

      if (buttonText) {
        submitButton.textContent = buttonText;
      } else {
        submitButton.textContent =
          authMode === "create"
            ? "Create account"
            : "Sign in";
      }

      if (!isBusy) {
        googleButtonText.textContent =
          authMode === "create"
            ? "Create account with Google"
            : "Continue with Google";
      }
    }

    function setAuthMode(mode) {
      authMode = mode;
      clearMessage();

      const creatingAccount =
        mode === "create";

      signInTab.classList.toggle(
        "active",
        !creatingAccount
      );

      createTab.classList.toggle(
        "active",
        creatingAccount
      );

      signInTab.setAttribute(
        "aria-selected",
        String(!creatingAccount)
      );

      createTab.setAttribute(
        "aria-selected",
        String(creatingAccount)
      );

      nameField.classList.toggle(
        "hidden",
        !creatingAccount
      );

      confirmPasswordField.classList.toggle(
        "hidden",
        !creatingAccount
      );

      marketingConsentField.classList.toggle(
        "hidden",
        !creatingAccount
      );

      forgotPasswordRow.classList.toggle(
        "hidden",
        creatingAccount
      );

      displayNameInput.required =
        creatingAccount;

      confirmPasswordInput.required =
        creatingAccount;

      passwordInput.autocomplete =
        creatingAccount
          ? "new-password"
          : "current-password";

      formTitle.textContent =
        creatingAccount
          ? "Create an account"
          : "Welcome back";

      formSubtitle.textContent =
        creatingAccount
          ? "Create an account to cast your vote."
          : "Sign in to continue to voting.";

      submitButton.textContent =
        creatingAccount
          ? "Create account"
          : "Sign in";

      googleButtonText.textContent =
        creatingAccount
          ? "Create account with Google"
          : "Continue with Google";

      if (!creatingAccount) {
        marketingConsentInput.checked = false;
        confirmPasswordInput.value = "";
      }
    }

    function escapeHTML(value) {
      return String(value || "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function getInitials(user) {
      const source =
        user.displayName ||
        user.email ||
        "User";

      return source
        .trim()
        .split(/\s+/)
        .filter(Boolean)
        .slice(0, 2)
        .map(part =>
          part.charAt(0).toUpperCase()
        )
        .join("");
    }

    function renderProfile(user) {
      const name =
        user.displayName ||
        user.email?.split("@")[0] ||
        "Guessing Games voter";

      const email = user.email || "";

      const avatar = user.photoURL
        ? `
          <img
            class="avatar"
            src="${escapeHTML(user.photoURL)}"
            alt=""
            referrerpolicy="no-referrer"
          />
        `
        : `
          <div class="avatar-placeholder">
            ${escapeHTML(getInitials(user))}
          </div>
        `;

      profileEl.innerHTML = `
        ${avatar}

        <h2 class="profile-name">
          ${escapeHTML(name)}
        </h2>

        <p class="profile-email">
          ${escapeHTML(email)}
        </p>
      `;

      const verified =
        user.emailVerified === true;

      verificationStatus.textContent =
        verified
          ? "Email verified"
          : "Email not verified";

      verificationStatus.className =
        verified
          ? "verification-status verified"
          : "verification-status unverified";

      resendVerificationButton.classList.toggle(
        "hidden",
        verified
      );
    }

    function normalizeEmail() {
      return emailInput.value
        .trim()
        .toLowerCase();
    }

    function validateEmailForm() {
      const email = normalizeEmail();
      const password = passwordInput.value;

      if (!email) {
        setMessage("Enter your email address.");
        emailInput.focus();
        return false;
      }

      if (!emailInput.validity.valid) {
        setMessage("Enter a valid email address.");
        emailInput.focus();
        return false;
      }

      if (!password) {
        setMessage("Enter your password.");
        passwordInput.focus();
        return false;
      }

      if (password.length < 6) {
        setMessage(
          "Your password must contain at least 6 characters."
        );

        passwordInput.focus();
        return false;
      }

      if (authMode === "create") {
        const displayName =
          displayNameInput.value.trim();

        if (!displayName) {
          setMessage("Enter your first name.");
          displayNameInput.focus();
          return false;
        }

        if (
          password !==
          confirmPasswordInput.value
        ) {
          setMessage(
            "The passwords do not match."
          );

          confirmPasswordInput.focus();
          return false;
        }
      }

      return true;
    }

    function readableAuthError(error) {
      const messages = {
        "auth/invalid-email":
          "Enter a valid email address.",

        "auth/missing-password":
          "Enter your password.",

        "auth/weak-password":
          "Choose a stronger password with at least 6 characters.",

        "auth/email-already-in-use":
          "An account already exists with this email. Try signing in instead.",

        "auth/invalid-credential":
          "The email or password is incorrect.",

        "auth/user-not-found":
          "No account was found with this email.",

        "auth/wrong-password":
          "The email or password is incorrect.",

        "auth/too-many-requests":
          "Too many attempts were made. Please wait before trying again.",

        "auth/network-request-failed":
          "A network error occurred. Check your connection and try again.",

        "auth/popup-closed-by-user":
          "The Google sign-in window was closed before sign-in finished.",

        "auth/popup-blocked":
          "Your browser blocked the Google sign-in window. Allow pop-ups and try again.",

        "auth/cancelled-popup-request":
          "Another Google sign-in attempt is already open.",

        "auth/unauthorized-domain":
          "This website domain has not been authorized in Firebase.",

        "auth/operation-not-allowed":
          "This sign-in method has not been enabled in Firebase.",

        "auth/account-exists-with-different-credential":
          "An account already exists with this email using another sign-in method."
      };

      return (
        messages[error.code] ||
        "Authentication failed. Please try again."
      );
    }

    function togglePassword(
      input,
      button
    ) {
      const showing =
        input.type === "text";

      input.type =
        showing
          ? "password"
          : "text";

      button.textContent =
        showing
          ? "Show"
          : "Hide";

      button.setAttribute(
        "aria-label",
        showing
          ? "Show password"
          : "Hide password"
      );
    }

    async function preparePersistence() {
      await setPersistence(
        auth,
        browserLocalPersistence
      );
    }

    function verificationActionSettings() {
      const signInURL = new URL(
        "signin.html",
        window.location.href
      );

      signInURL.searchParams.set(
        "redirect",
        redirectTarget
      );

      return {
        url: signInURL.toString(),
        handleCodeInApp: false
      };
    }

    function getConsentReference(user) {
      return doc(
        db,
        "email-marketing-consents",
        user.uid
      );
    }

    async function createConsentRecord(
      user,
      marketingConsent,
      source
    ) {
      const record = {
        uid: user.uid,
        email: user.email || "",
        displayName: user.displayName || "",
        marketingConsent:
          marketingConsent === true,
        emailVerified:
          user.emailVerified === true,
        consentSource: source,
        consentVersion: "2026-08-06",
        updatedAt: serverTimestamp()
      };

      if (marketingConsent) {
        record.consentedAt =
          serverTimestamp();
      }

      await setDoc(
        getConsentReference(user),
        {
          ...record,
          createdAt: serverTimestamp()
        },
        {
          merge: true
        }
      );
    }

    async function syncExistingConsentRecord(
      user
    ) {
      if (!user?.email) {
        return;
      }

      await user.reload();

      const refreshedUser =
        auth.currentUser;

      if (!refreshedUser) {
        return;
      }

      const consentReference =
        getConsentReference(refreshedUser);

      const consentSnapshot =
        await getDoc(consentReference);

      if (!consentSnapshot.exists()) {
        return;
      }

      await setDoc(
        consentReference,
        {
          email:
            refreshedUser.email || "",
          displayName:
            refreshedUser.displayName || "",
          emailVerified:
            refreshedUser.emailVerified === true,
          updatedAt:
            serverTimestamp()
        },
        {
          merge: true
        }
      );
    }

    async function redirectAfterAuthentication() {
      window.location.assign(
        redirectTarget
      );
    }

    async function startGoogleAuthentication() {
      clearMessage();
      setBusy(true);

      googleButtonText.textContent =
        authMode === "create"
          ? "Opening Google..."
          : "Opening Google...";

      const consentRequested =
        authMode === "create" &&
        marketingConsentInput.checked;

      try {
        await preparePersistence();

        const useRedirect =
          window
            .matchMedia("(max-width: 700px)")
            .matches ||
          /Android|iPhone|iPad|iPod/i.test(
            navigator.userAgent
          );

        if (useRedirect) {
          redirectInProgress = true;

          sessionStorage.setItem(
            "gg_auth_redirect",
            redirectTarget
          );

          sessionStorage.setItem(
            "gg_google_auth_mode",
            authMode
          );

          sessionStorage.setItem(
            "gg_marketing_consent",
            String(consentRequested)
          );

          await signInWithRedirect(
            auth,
            googleProvider
          );

          return;
        }

        const credential =
          await signInWithPopup(
            auth,
            googleProvider
          );

        if (authMode === "create") {
          await createConsentRecord(
            credential.user,
            consentRequested,
            "google-account-creation"
          );
        } else {
          await syncExistingConsentRecord(
            credential.user
          );
        }

        await redirectAfterAuthentication();
      } catch (error) {
        console.error(
          "Google authentication failed:",
          error
        );

        setMessage(
          readableAuthError(error)
        );

        setBusy(false);
      }
    }

    async function handleEmailAuthentication(
      event
    ) {
      event.preventDefault();
      clearMessage();

      if (!validateEmailForm()) {
        return;
      }

      const email = normalizeEmail();
      const password =
        passwordInput.value;

      setBusy(
        true,
        authMode === "create"
          ? "Creating account..."
          : "Signing in..."
      );

      try {
        await preparePersistence();

        if (authMode === "create") {
          accountCreationInProgress = true;

          const credential =
            await createUserWithEmailAndPassword(
              auth,
              email,
              password
            );

          const user = credential.user;

          const displayName =
            displayNameInput.value.trim();

          const marketingConsent =
            marketingConsentInput.checked;

          await updateProfile(user, {
            displayName
          });

          await user.reload();

          const updatedUser =
            auth.currentUser || user;

          await createConsentRecord(
            updatedUser,
            marketingConsent,
            "email-account-creation"
          );

          await sendEmailVerification(
            updatedUser,
            verificationActionSettings()
          );

          passwordInput.value = "";
          confirmPasswordInput.value = "";

          setMessage(
            "Your account was created.",
            "success"
          );

          renderProfile(updatedUser);

          authView.classList.add("hidden");
          signedInView.classList.add("show");

          return;
        }

        const credential =
          await signInWithEmailAndPassword(
            auth,
            email,
            password
          );

        await syncExistingConsentRecord(
          credential.user
        );

        await redirectAfterAuthentication();
      } catch (error) {
        console.error(
          "Email authentication failed:",
          error
        );

        setMessage(
          readableAuthError(error)
        );
      } finally {
        accountCreationInProgress = false;
        setBusy(false);
      }
    }

    async function sendPasswordReset() {
      clearMessage();

      const email = normalizeEmail();

      if (
        !email ||
        !emailInput.validity.valid
      ) {
        setMessage(
          "Enter your email address first, then select Forgot password."
        );

        emailInput.focus();
        return;
      }

      forgotPasswordButton.disabled = true;
      forgotPasswordButton.textContent =
        "Sending...";

      try {
        await sendPasswordResetEmail(
          auth,
          email
        );

        setMessage(
          "A password reset link has been sent. Check your email and spam folder.",
          "success"
        );
      } catch (error) {
        console.error(
          "Password reset failed:",
          error
        );

        setMessage(
          readableAuthError(error)
        );
      } finally {
        forgotPasswordButton.disabled = false;
        forgotPasswordButton.textContent =
          "Forgot password?";
      }
    }

    async function resendVerification() {
      const user = auth.currentUser;

      if (!user) {
        setMessage(
          "Sign in before requesting another verification email."
        );

        return;
      }

      if (user.emailVerified) {
        setMessage(
          "Your email is already verified.",
          "success"
        );

        renderProfile(user);
        return;
      }

      resendVerificationButton.disabled = true;
      resendVerificationButton.textContent =
        "Sending...";

      try {
        await sendEmailVerification(
          user,
          verificationActionSettings()
        );

        setMessage(
          "A new verification email was sent. Check your inbox and spam folder.",
          "success"
        );
      } catch (error) {
        console.error(
          "Verification email failed:",
          error
        );

        setMessage(
          readableAuthError(error)
        );
      } finally {
        resendVerificationButton.disabled = false;
        resendVerificationButton.textContent =
          "Resend verification email";
      }
    }

    signInTab.addEventListener(
      "click",
      () => {
        setAuthMode("signin");
      }
    );

    createTab.addEventListener(
      "click",
      () => {
        setAuthMode("create");
      }
    );

    googleButton.addEventListener(
      "click",
      startGoogleAuthentication
    );

    emailForm.addEventListener(
      "submit",
      handleEmailAuthentication
    );

    forgotPasswordButton.addEventListener(
      "click",
      sendPasswordReset
    );

    resendVerificationButton.addEventListener(
      "click",
      resendVerification
    );

    showPasswordButton.addEventListener(
      "click",
      () => {
        togglePassword(
          passwordInput,
          showPasswordButton
        );
      }
    );

    showConfirmPasswordButton.addEventListener(
      "click",
      () => {
        togglePassword(
          confirmPasswordInput,
          showConfirmPasswordButton
        );
      }
    );

    signoutButton.addEventListener(
      "click",
      async () => {
        clearMessage();
        setBusy(true);

        signoutButton.textContent =
          "Signing out...";

        try {
          await signOut(auth);

          setMessage(
            "You have been signed out.",
            "success"
          );
        } catch (error) {
          console.error(
            "Sign-out failed:",
            error
          );

          setMessage(
            "Could not sign out. Please try again."
          );
        } finally {
          signoutButton.textContent =
            "Sign out";

          setBusy(false);
        }
      }
    );

    try {
      const redirectResult =
        await getRedirectResult(auth);

      if (redirectResult?.user) {
        const user =
          redirectResult.user;

        const storedRedirect =
          sessionStorage.getItem(
            "gg_auth_redirect"
          ) || redirectTarget;

        const storedAuthMode =
          sessionStorage.getItem(
            "gg_google_auth_mode"
          ) || "signin";

        const storedConsent =
          sessionStorage.getItem(
            "gg_marketing_consent"
          ) === "true";

        sessionStorage.removeItem(
          "gg_auth_redirect"
        );

        sessionStorage.removeItem(
          "gg_google_auth_mode"
        );

        sessionStorage.removeItem(
          "gg_marketing_consent"
        );

        if (storedAuthMode === "create") {
          await createConsentRecord(
            user,
            storedConsent,
            "google-account-creation"
          );
        } else {
          await syncExistingConsentRecord(
            user
          );
        }

        window.location.replace(
          storedRedirect
        );
      }
    } catch (error) {
      console.error(
        "Google redirect failed:",
        error
      );

      setMessage(
        readableAuthError(error)
      );
    }

    onAuthStateChanged(
      auth,
      async user => {
        if (
          redirectInProgress ||
          accountCreationInProgress
        ) {
          return;
        }

        if (user) {
          try {
            await syncExistingConsentRecord(
              user
            );
          } catch (error) {
            console.error(
              "Consent verification sync failed:",
              error
            );
          }

          const refreshedUser =
            auth.currentUser || user;

          renderProfile(refreshedUser);

          authView.classList.add("hidden");
          signedInView.classList.add("show");
        } else {
          authView.classList.remove("hidden");
          signedInView.classList.remove("show");
        }
      }
    );

    setAuthMode("signin");
  </script>
</body>
</html>
