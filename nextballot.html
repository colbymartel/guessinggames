<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Suggest Next Ballot</title>
  <style>
    :root {
      --brand: #4f86b3;
      --brand-dark: #376f9c;
      --bg: #f6f9fc;
      --ink: #172331;
      --muted: #66788a;
      --line: #dbe6ef;
      --soft: #edf4fa;
      --white: #ffffff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button,
    input,
    textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .page {
      width: min(100%, 860px);
      margin: 0 auto;
      padding: 28px 24px 56px;
    }

    nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 28px;
      border-bottom: 1px solid var(--line);
    }

    .logo {
      font-size: 18px;
      letter-spacing: -0.04em;
      font-weight: 800;
    }

    .nav-btn {
      color: var(--ink);
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 9px 14px;
      background: var(--white);
      font-size: 14px;
      font-weight: 650;
    }

    .hero {
      display: grid;
      justify-items: center;
      text-align: center;
      gap: 16px;
      padding: 70px 0 28px;
    }

    .eyebrow {
      color: var(--brand);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      max-width: 720px;
      font-size: clamp(42px, 8vw, 82px);
      line-height: 0.94;
      letter-spacing: -0.08em;
      font-weight: 850;
    }

    .subhead {
      margin: 0;
      max-width: 520px;
      color: var(--muted);
      font-size: 18px;
      line-height: 1.5;
    }

    .panel {
      max-width: 620px;
      margin: 10px auto 0;
      padding: 24px;
      background: var(--white);
      border: 1px solid var(--line);
      border-radius: 24px;
      box-shadow: 0 18px 42px rgba(23, 35, 49, 0.07);
    }

    .form {
      display: grid;
      gap: 14px;
    }

    label {
      display: grid;
      gap: 8px;
      color: var(--ink);
      font-size: 14px;
      font-weight: 750;
    }

    input,
    textarea {
      width: 100%;
      border: 1px solid var(--line);
      background: var(--white);
      border-radius: 16px;
      padding: 0 15px;
      outline: none;
      color: var(--ink);
    }

    input {
      height: 52px;
    }

    textarea {
      min-height: 104px;
      resize: vertical;
      padding-top: 14px;
      line-height: 1.45;
    }

    input:focus,
    textarea:focus {
      border-color: var(--brand);
      box-shadow: 0 0 0 4px rgba(79, 134, 179, 0.12);
    }

    .submit-button {
      width: 100%;
      min-height: 54px;
      margin-top: 4px;
      border: 0;
      border-radius: 999px;
      background: var(--brand);
      color: white;
      font-size: 17px;
      font-weight: 750;
      transition: opacity 0.16s ease, background 0.16s ease;
    }

    .submit-button:hover {
      background: var(--brand-dark);
    }

    .submit-button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .message {
      display: none;
      margin-top: 14px;
      color: var(--brand-dark);
      font-size: 14px;
      line-height: 1.4;
      text-align: center;
      font-weight: 650;
    }

    .message.show {
      display: block;
    }

    .small-note {
      margin: 14px 0 0;
      color: var(--muted);
      text-align: center;
      font-size: 13px;
      line-height: 1.45;
    }

    @media (max-width: 620px) {
      .page {
        padding: 22px 16px 44px;
      }

      .hero {
        padding: 52px 0 26px;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <nav>
      <a class="logo" href="games.html">Guessing Games</a>
      <a class="nav-btn" href="halloffame.html">Hall of Fame</a>
    </nav>

    <section class="hero">
      <div class="eyebrow">Vote submitted</div>
      <h1>Who belongs on the next ballot?</h1>
      <p class="subhead">Suggest a name for a future Name Hall of Fame ballot.</p>
    </section>

    <section class="panel">
      <form class="form" id="suggestionForm">
        <label>
          Name suggestion
          <input id="nameInput" maxlength="28" autocomplete="off" placeholder="Enter a name" required />
        </label>

        <label>
          Why should they make the ballot? <span style="color: var(--muted); font-weight: 600;">Optional</span>
          <textarea id="reasonInput" placeholder="Tell us what makes the name cool, funny, rare, or Hall of Fame worthy." maxlength="180"></textarea>
        </label>

        <button class="submit-button" id="submitButton" type="submit">Submit and Finish</button>
      </form>

      <div class="message" id="message"></div>
    </section>
  </main>

  <script>
    const SUGGESTION_KEY = "gg_next_ballot_suggestions_week_1_round_1_v1";

    const form = document.getElementById("suggestionForm");
    const nameInput = document.getElementById("nameInput");
    const reasonInput = document.getElementById("reasonInput");
    const messageEl = document.getElementById("message");
    const submitButton = document.getElementById("submitButton");

    function getSuggestions() {
      const saved = localStorage.getItem(SUGGESTION_KEY);

      if (saved) {
        try {
          return JSON.parse(saved);
        } catch {}
      }

      return [];
    }

    function saveSuggestions(suggestions) {
      localStorage.setItem(SUGGESTION_KEY, JSON.stringify(suggestions));
    }

    form.addEventListener("submit", async event => {
      event.preventDefault();

      const rawName = nameInput.value.trim();
      const cleanName = rawName
        .replace(/[^a-zA-ZÀ-ÿ' .-]/g, "")
        .replace(/\s+/g, " ")
        .trim();

      if (cleanName.length < 1) {
        showMessage("Enter a name first.");
        nameInput.focus();
        return;
      }

      const suggestionPayload = {
        week: 1,
        round: 1,
        name: cleanName,
        reason: reasonInput.value.trim(),
        submittedAtLocal: new Date().toISOString(),
        userAgent: navigator.userAgent,
        page: window.location.pathname
      };

      const suggestions = getSuggestions();
      suggestions.push(suggestionPayload);
      saveSuggestions(suggestions);

      try {
        submitButton.disabled = true;
        submitButton.textContent = "Submitting...";

        if (window.recordNextBallotSuggestion) {
          await window.recordNextBallotSuggestion(suggestionPayload);
        }

        nameInput.value = "";
        reasonInput.value = "";
        showMessage(`${cleanName} was submitted for the next ballot.`);
      } catch (error) {
        console.error("Firebase suggestion save failed:", error);
        showMessage("Something went wrong. Try again.");
      } finally {
        submitButton.disabled = false;
        submitButton.textContent = "Submit and Finish";
      }
    });

    function showMessage(text) {
      messageEl.textContent = text;
      messageEl.classList.add("show");
    }
  </script>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import {
      getFirestore,
      collection,
      addDoc,
      doc,
      setDoc,
      increment,
      serverTimestamp
    } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyB-N0Y02yh3xoXSPu6XsqSZGP3m0ZxprpI",
      authDomain: "guessinggames.firebaseapp.com",
      projectId: "guessinggames",
      storageBucket: "guessinggames.firebasestorage.app",
      messagingSenderId: "431644741449",
      appId: "1:431644741449:web:0b699b3acdec1f95b19498"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    window.recordNextBallotSuggestion = async function(suggestionPayload) {
      await addDoc(collection(db, "next-ballot-suggestions"), {
        ...suggestionPayload,
        createdAt: serverTimestamp()
      });

      await setDoc(
        doc(db, "next-ballot-suggestion-results", "week-1-round-1"),
        {
          week: 1,
          round: 1,
          totalSuggestions: increment(1),
          lastSuggestionAt: serverTimestamp()
        },
        { merge: true }
      );
    };
  </script>
</body>
</html>
