<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Suggest Next Ballot</title>

  <style>
    :root {
      --brand: #4f86b3;
      --brand-dark: #376f9c;
      --bg: #f6f9fc;
      --ink: #172331;
      --muted: #66788a;
      --line: #dbe6ef;
      --soft: #edf4fa;
      --white: #ffffff;
      --shadow: 0 18px 42px rgba(23, 35, 49, 0.07);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button,
    input,
    textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .page {
      width: min(100%, 980px);
      margin: 0 auto;
      padding: 24px 24px 56px;
    }

    nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      padding: 8px 0 24px;
    }

    .logo {
      font-size: 18px;
      letter-spacing: -0.04em;
      font-weight: 850;
      white-space: nowrap;
    }

    .links {
      display: flex;
      align-items: center;
      gap: 18px;
      color: var(--muted);
      font-size: 14px;
      font-weight: 650;
    }

    .links a {
      transition: color 0.16s ease;
    }

    .links a:hover {
      color: var(--ink);
    }

    .nav-btn {
      color: var(--ink) !important;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 9px 14px;
      background: var(--white);
      font-size: 14px;
      font-weight: 750;
      box-shadow: 0 6px 18px rgba(23, 35, 49, 0.04);
    }

    .hero {
      display: grid;
      justify-items: center;
      text-align: center;
      gap: 16px;
      padding: 72px 0 28px;
    }

    .eyebrow {
      color: var(--brand);
      font-size: 12px;
      font-weight: 850;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      max-width: 760px;
      font-size: clamp(42px, 8vw, 82px);
      line-height: 0.94;
      letter-spacing: -0.08em;
      font-weight: 850;
    }

    .subhead {
      margin: 0;
      max-width: 560px;
      color: var(--muted);
      font-size: 18px;
      line-height: 1.5;
    }

    .panel {
      max-width: 640px;
      margin: 10px auto 0;
      padding: 24px;
      background: var(--white);
      border: 1px solid var(--line);
      border-radius: 24px;
      box-shadow: var(--shadow);
    }

    .form {
      display: grid;
      gap: 14px;
    }

    label {
      display: grid;
      gap: 8px;
      color: var(--ink);
      font-size: 14px;
      font-weight: 750;
    }

    input,
    textarea {
      width: 100%;
      border: 1px solid var(--line);
      background: var(--white);
      border-radius: 16px;
      padding: 0 15px;
      outline: none;
      color: var(--ink);
    }

    input {
      height: 52px;
    }

    textarea {
      min-height: 104px;
      resize: vertical;
      padding-top: 14px;
      line-height: 1.45;
    }

    input:focus,
    textarea:focus {
      border-color: var(--brand);
      box-shadow: 0 0 0 4px rgba(79, 134, 179, 0.12);
    }

    .actions {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
      margin-top: 4px;
    }

    .submit-button,
    .skip-button,
    .home-button,
    .secondary-button {
      width: 100%;
      min-height: 54px;
      border-radius: 999px;
      font-size: 16px;
      font-weight: 800;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: opacity 0.16s ease, background 0.16s ease, border-color 0.16s ease;
    }

    .submit-button,
    .home-button {
      border: 0;
      background: var(--brand);
      color: white;
    }

    .submit-button:hover,
    .home-button:hover {
      background: var(--brand-dark);
    }

    .skip-button,
    .secondary-button {
      border: 1px solid var(--line);
      background: var(--white);
      color: var(--ink);
    }

    .skip-button:hover,
    .secondary-button:hover {
      border-color: var(--brand);
      background: var(--soft);
    }

    .submit-button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .thanks {
      display: none;
      max-width: 640px;
      margin: 10px auto 0;
      padding: 34px 24px;
      background: var(--white);
      border: 1px solid var(--line);
      border-radius: 24px;
      box-shadow: var(--shadow);
      text-align: center;
    }

    .thanks.show {
      display: block;
    }

    .thanks h1 {
      font-size: clamp(38px, 7vw, 68px);
      margin-top: 10px;
    }

    .thanks-message {
      margin: 14px auto 24px;
      max-width: 480px;
      color: var(--muted);
      font-size: 17px;
      line-height: 1.5;
    }

    .hidden {
      display: none;
    }

    @media (max-width: 720px) {
      .page {
        padding: 20px 16px 44px;
      }

      nav {
        align-items: flex-start;
      }

      .links {
        gap: 10px;
        flex-wrap: wrap;
        justify-content: flex-end;
        font-size: 13px;
      }

      .nav-btn {
        padding: 8px 12px;
      }

      .hero {
        padding: 52px 0 26px;
      }
    }

    @media (max-width: 480px) {
      nav {
        display: grid;
        gap: 14px;
      }

      .links {
        justify-content: flex-start;
      }

      h1 {
        letter-spacing: -0.07em;
      }
    }
  </style>
</head>

<body>
  <main class="page">
    <nav aria-label="Primary">
      <a class="logo" href="index.html">Guessing Games</a>

      <div class="links">
        <a href="index.html">Games</a>
        <a href="halloffame.html">Hall of Fame</a>
        <a href="live.html">Live</a>
        <a href="about.html">About</a>
        <a class="nav-btn" href="signin.html">Sign in</a>
      </div>
    </nav>

    <section class="hero" id="hero">
      <div class="eyebrow">Vote submitted</div>
      <h1>Your vote is in.</h1>
      <p class="subhead">
        Want to help choose next week’s Name Hall of Fame ballot?
      </p>
    </section>

    <section class="panel" id="suggestionPanel">
      <form class="form" id="suggestionForm">
        <label>
          Who should make the next ballot?
          <input
            id="nameInput"
            maxlength="28"
            autocomplete="off"
            placeholder="Enter a name featured in my videos..."
            required
          />
        </label>

        <label>
          Why should they make the ballot?
          <textarea
            id="reasonInput"
            placeholder="Tell us what makes it cool, funny, rare, or Hall of Fame worthy."
            maxlength="180"
          ></textarea>
        </label>

        <div class="actions">
          <button class="submit-button" id="submitButton" type="submit">
            Submit suggestion
          </button>

          <button class="skip-button" id="skipButton" type="button">
            Skip for now
          </button>
        </div>
      </form>
    </section>

    <section class="thanks" id="thanks">
      <div class="eyebrow">All set</div>

      <h1>Thanks for playing.</h1>

      <p class="thanks-message" id="thanksMessage">
        Your vote counted. Check back next week to see who makes the ballot.
      </p>

      <div class="actions">
        <a class="home-button" href="index.html">Back to Home</a>
        <a class="secondary-button" href="halloffame.html">View Hall of Fame</a>
      </div>
    </section>
  </main>

  <script>
    const SUGGESTION_KEY = "gg_next_ballot_suggestions_week_1_round_1_v1";

    const form = document.getElementById("suggestionForm");
    const nameInput = document.getElementById("nameInput");
    const reasonInput = document.getElementById("reasonInput");
    const submitButton = document.getElementById("submitButton");
    const skipButton = document.getElementById("skipButton");

    const hero = document.getElementById("hero");
    const suggestionPanel = document.getElementById("suggestionPanel");
    const thanks = document.getElementById("thanks");
    const thanksMessage = document.getElementById("thanksMessage");

    function getSuggestions() {
      const saved = localStorage.getItem(SUGGESTION_KEY);

      if (saved) {
        try {
          return JSON.parse(saved);
        } catch {}
      }

      return [];
    }

    function saveSuggestions(suggestions) {
      localStorage.setItem(SUGGESTION_KEY, JSON.stringify(suggestions));
    }

    function getVoteFromUrlOrStorage() {
      const params = new URLSearchParams(window.location.search);

      const urlVote =
        params.get("vote") ||
        params.get("selected") ||
        params.get("name");

      const savedVote =
        localStorage.getItem("gg_last_vote_selection") ||
        localStorage.getItem("gg_name_hall_of_fame_last_vote");

      return urlVote || savedVote || "Submitted";
    }

    function showThanks(message) {
      thanksMessage.textContent = message;

      hero.classList.add("hidden");
      suggestionPanel.classList.add("hidden");
      thanks.classList.add("show");

      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });
    }

    form.addEventListener("submit", async event => {
      event.preventDefault();

      const rawName = nameInput.value.trim();

      const cleanName = rawName
        .replace(/[^a-zA-ZÀ-ÿ' .-]/g, "")
        .replace(/\s+/g, " ")
        .trim();

      if (cleanName.length < 1) {
        nameInput.focus();
        return;
      }

      const suggestionPayload = {
        week: 1,
        round: 1,
        name: cleanName,
        reason: reasonInput.value.trim(),
        vote: getVoteFromUrlOrStorage(),
        submittedAtLocal: new Date().toISOString(),
        userAgent: navigator.userAgent,
        page: window.location.pathname
      };

      const suggestions = getSuggestions();
      suggestions.push(suggestionPayload);
      saveSuggestions(suggestions);

      try {
        submitButton.disabled = true;
        submitButton.textContent = "Submitting...";

        if (window.recordNextBallotSuggestion) {
          await window.recordNextBallotSuggestion(suggestionPayload);
        }

        nameInput.value = "";
        reasonInput.value = "";

        showThanks(`${cleanName} was submitted for next week’s ballot.`);
      } catch (error) {
        console.error("Firebase suggestion save failed:", error);

        showThanks(`${cleanName} was saved. Thanks for helping choose next week’s ballot.`);
      } finally {
        submitButton.disabled = false;
        submitButton.textContent = "Submit suggestion";
      }
    });

    skipButton.addEventListener("click", () => {
      showThanks("Your vote counted. Check back next week to see who makes the ballot.");
    });
  </script>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";

    import {
      getFirestore,
      collection,
      addDoc,
      doc,
      setDoc,
      increment,
      serverTimestamp
    } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyB-N0Y02yh3xoXSPu6XsqSZGP3m0ZxprpI",
      authDomain: "guessinggames.firebaseapp.com",
      projectId: "guessinggames",
      storageBucket: "guessinggames.firebasestorage.app",
      messagingSenderId: "431644741449",
      appId: "1:431644741449:web:0b699b3acdec1f95b19498"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    window.recordNextBallotSuggestion = async function(suggestionPayload) {
      await addDoc(collection(db, "next-ballot-suggestions"), {
        ...suggestionPayload,
        createdAt: serverTimestamp()
      });

      await setDoc(
        doc(db, "next-ballot-suggestion-results", "week-1-round-1"),
        {
          week: 1,
          round: 1,
          totalSuggestions: increment(1),
          lastSuggestionAt: serverTimestamp()
        },
        { merge: true }
      );
    };
  </script>
</body>
</html>
