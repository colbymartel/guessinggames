      --brand-dark: #376f9c;

      --muted: #66788a;
      --line: #dbe6ef;
      --soft: #edf4fa;
      --white: #ffffff;
      --correct: #2f9e67;
      --correct-soft: #e9f7ef;
      --wrong: #d95b5b;
      --wrong-soft: #fff0f0;
      --gold: #e0b84f;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system,
        BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    a { color: inherit; text-decoration: none; }

    nav {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 999;
      padding: 1.25rem 2.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(247, 250, 252, 0.92);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid rgba(79, 134, 179, 0.18);
      transition: background 0.3s, box-shadow 0.3s;
    }

    nav.scrolled {
      background: rgba(247, 250, 252, 0.98);
      box-shadow: 0 4px 24px rgba(79, 134, 179, 0.12);
    }

    .nav-logo {
      color: var(--brand);
      font-size: 1.3rem;
      font-weight: 800;
      letter-spacing: 0.05em;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 2.5rem;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .nav-links a {
      color: var(--muted);
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      transition: color 0.2s;
    }

    .nav-links a:hover,
    .nav-links a.active { color: var(--brand); }

    .nav-account {
      padding: 9px 14px !important;
      color: var(--ink) !important;
      background: var(--white);
      border: 1px solid var(--line);
      border-radius: 999px;
      letter-spacing: 0.04em !important;
      text-transform: none !important;
    }

    .hamburger {
      display: none;
      padding: 8px;
      color: var(--ink);
      background: none;
      border: 0;
      font-size: 1.25rem;
      cursor: pointer;
    }

    .page {
      width: min(100%, 980px);
      margin: 0 auto;
      padding: 128px 24px 64px;
    }

    .hero {
      display: grid;
      justify-items: center;
      text-align: center;
      gap: 12px;
      margin-bottom: 26px;
    }

    .eyebrow {
      color: var(--brand);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(44px, 8vw, 78px);
      line-height: 0.95;
      letter-spacing: -0.07em;
      font-weight: 850;
    }

    .subtitle {
      margin: 3px 0 0;
      color: var(--muted);
      font-size: 16px;
      font-weight: 550;
    }

    .game-shell {
      background: var(--white);
      border: 1px solid var(--line);
      border-radius: 28px;
      box-shadow: 0 20px 50px rgba(23, 35, 49, 0.08);
      overflow: hidden;
    }

    .game-topbar {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      padding: 18px;
      border-bottom: 1px solid var(--line);
      background: linear-gradient(180deg, #ffffff, #fbfdff);
    }

    .stat {
      min-height: 66px;
      display: grid;
      place-items: center;
      text-align: center;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: var(--soft);
    }

    .stat-label {
      display: block;
      margin-bottom: 3px;
      color: var(--muted);
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .stat-value {
      font-size: 22px;
      font-weight: 850;
      letter-spacing: -0.04em;
    }

    .game-content {
      padding: 28px;
    }

    .progress-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      margin-bottom: 16px;
    }

    .question-count {
      color: var(--brand);
      font-size: 12px;
      font-weight: 850;
      letter-spacing: 0.13em;
      text-transform: uppercase;
    }

    .progress-track {
      flex: 1;
      height: 8px;
      overflow: hidden;
      border-radius: 999px;
      background: var(--soft);
      border: 1px solid var(--line);
    }

    .progress-fill {
      width: 0%;
      height: 100%;
      background: var(--brand);
      border-radius: inherit;
      transition: width 0.25s ease;
    }

    .flag-card {
      display: grid;
      place-items: center;
      min-height: 300px;
      margin-bottom: 22px;
      padding: 24px;
      border-radius: 24px;
      background:
        radial-gradient(circle at 50% 12%, rgba(79,134,179,.13), transparent 42%),
        var(--soft);
      border: 1px solid var(--line);
    }

    .flag {
      width: min(100%, 430px);
      aspect-ratio: 3 / 2;
      display: grid;
      place-items: center;
      overflow: hidden;
      border-radius: 14px;
      background: #fff;
      box-shadow: 0 18px 38px rgba(23, 35, 49, 0.14);
      border: 1px solid rgba(23,35,49,.09);
      font-size: clamp(100px, 20vw, 180px);
      line-height: 1;
    }

    .prompt {
      margin: 0 0 18px;
      text-align: center;
      font-size: clamp(22px, 4vw, 32px);
      line-height: 1.08;
      letter-spacing: -0.045em;
      font-weight: 850;
    }

    .answers {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .answer {
      min-height: 68px;
      padding: 14px 18px;
      text-align: left;
      color: var(--ink);
      background: var(--white);
      border: 1px solid var(--line);
      border-radius: 18px;
      font: inherit;
      font-size: 16px;
      font-weight: 750;
      cursor: pointer;
      transition: transform .15s, border-color .15s, background .15s, box-shadow .15s;
    }

    .answer:hover:not(:disabled) {
      transform: translateY(-2px);
      border-color: var(--brand);
      box-shadow: 0 10px 24px rgba(79, 134, 179, 0.12);
    }

    .answer.correct {
      background: var(--correct-soft);
      border-color: var(--correct);
      color: #1f704b;
    }

    .answer.wrong {
      background: var(--wrong-soft);
      border-color: var(--wrong);
      color: #9e3838;
    }

    .answer:disabled { cursor: default; }

    .feedback {
      min-height: 46px;
      display: grid;
      place-items: center;
      margin-top: 16px;
      text-align: center;
      color: var(--muted);
      font-size: 15px;
      font-weight: 700;
    }

    .next-btn,
    .restart-btn {
      display: none;
      width: 100%;
      min-height: 54px;
      margin-top: 4px;
      border: 0;
      border-radius: 999px;
      background: var(--brand);
      color: white;
      font: inherit;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
    }

    .next-btn:hover,
    .restart-btn:hover { background: var(--brand-dark); }

    .game-over {
      display: none;
      grid-column: 1 / -1;
      text-align: center;
      padding: 20px 4px 6px;
    }

    .game-over-icon {
      font-size: 54px;
      margin-bottom: 10px;
    }

    .game-over h2 {
      margin: 0;
      font-size: 38px;
      letter-spacing: -0.06em;
    }

    .game-over p {
      margin: 10px 0 22px;
      color: var(--muted);
      font-size: 16px;
      font-weight: 600;
    }

    .final-score {
      color: var(--brand);
      font-weight: 850;
    }


    /* DESKTOP GAME LAYOUT */
    @media (min-width: 901px) {
      .game-content {
        display: grid;
        grid-template-columns: minmax(0, 1.15fr) minmax(320px, 0.85fr);
        grid-template-areas:
          "flag side";
        gap: 18px 24px;
        align-items: start;
      }

      .flag-card {
        grid-area: flag;
        min-height: 360px;
        margin-bottom: 0;
      }

      .desktop-side {
        grid-area: side;
        display: flex;
        flex-direction: column;
        align-self: center;
      }

      .desktop-side .prompt {
        text-align: left;
        margin-bottom: 16px;
      }

      .desktop-side .answers {
        grid-template-columns: 1fr;
      }

      .feedback {
        margin-top: 0;
      }
    }

    @media (max-width: 900px) {
      nav { padding: 1rem 1.5rem; }
      .nav-links { display: none; }
      .hamburger { display: block; }

      .nav-links.open {
        position: fixed;
        top: 62px;
        left: 0;
        right: 0;
        display: flex;
        flex-direction: column;
        align-items: stretch;
        gap: 0;
        padding: 1rem 1.5rem 1.5rem;

        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border-bottom: 1px solid var(--line);
        box-shadow: 0 12px 30px rgba(23, 35, 49, 0.08);
      }

      .nav-links.open li { width: 100%; }
      .nav-links.open a {
        display: block;
        width: 100%;
        padding: 14px 4px;
        border-bottom: 1px solid rgba(79, 134, 179, 0.10);
      }
    }

    @media (max-width: 620px) {
      .page { padding: 108px 14px 38px; }
      nav { padding: 0.95rem 1rem; }
      .nav-logo { font-size: 1.1rem; }
      .nav-links.open { top: 58px; padding-left: 1rem; padding-right: 1rem; }

      h1 { font-size: 50px; }

      .game-topbar {
        grid-template-columns: 1fr 1fr;
      }

      .game-topbar .stat:last-child {
        grid-column: 1 / -1;
      }

      .game-content { padding: 18px; }

      .flag-card {
        min-height: 220px;
        padding: 16px;
      }

      .answers { grid-template-columns: 1fr; }

      .answer {
        min-height: 58px;
        text-align: center;
      }
    }
  </style>
</head>

    const flagEl = document.getElementById("flag");

    let currentUser = null;
    let cloudHighScore = 0;

    let score = 0;
    let timeLeft = 120;
    let timerInterval = null;
    let timerStarted = false;
    let currentQuestion = null;
    let answered = false;
    let deck = [];

    let highScore = Number(localStorage.getItem("flagGameHighScore") || 0);
    highScoreEl.textContent = highScore;

    async function loadCloudHighScore(user) {
      if (!user) return;

      try {
        const scoreRef = doc(db, "leaderboards", "flags", "scores", user.uid);
        const snap = await getDoc(scoreRef);

        if (snap.exists()) {
          cloudHighScore = Number(snap.data().score || 0);

          if (cloudHighScore > highScore) {
            highScore = cloudHighScore;
            localStorage.setItem("flagGameHighScore", String(highScore));
            highScoreEl.textContent = highScore;
          }
        }
      } catch (error) {
        console.error("Could not load community high score:", error);
      }
    }

    async function saveCloudHighScore() {
      if (!currentUser || score <= cloudHighScore) return;

      try {
        const scoreRef = doc(db, "leaderboards", "flags", "scores", currentUser.uid);
        const existingSnap = await getDoc(scoreRef);
        const existingScore = existingSnap.exists()
          ? Number(existingSnap.data().score || 0)
          : 0;

        if (score <= existingScore) {
          cloudHighScore = existingScore;
          return;
        }

        const displayName =
          currentUser.displayName ||
          currentUser.email?.split("@")[0] ||
          "Player";

        await setDoc(scoreRef, {
          uid: currentUser.uid,
          displayName,
          photoURL: currentUser.photoURL || "",
          score,
          updatedAt: serverTimestamp()
        });

        cloudHighScore = score;
      } catch (error) {
        console.error("Could not save community high score:", error);
      }
    }

    function shuffle(array) {
      const copy = [...array];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function resetDeck() {
      // When every flag has been used, reshuffle the full set and keep going.
      // The game has no question limit; it ends when the 2-minute timer reaches zero.
      deck = shuffle(questions);
    }

    function formatTime(seconds) {
      const safe = Math.max(0, seconds);
      const minutes = Math.floor(safe / 60);
      const remaining = safe % 60;
      return `${minutes}:${String(remaining).padStart(2, "0")}`;
    }

    function updateTimer() {
      timerEl.textContent = formatTime(timeLeft);
    }

    function stopTimer() {
      if (timerInterval) {
        clearInterval(timerInterval);
        timerInterval = null;
      }
    }

    function startTimer() {
      stopTimer();
      updateTimer();

      timerInterval = setInterval(() => {
        timeLeft -= 1;
        updateTimer();

        if (timeLeft <= 0) {
          stopTimer();
          endGame();
        }
      }, 1000);
    }

    function subtractTime(seconds) {
      timeLeft = Math.max(0, timeLeft - seconds);
      updateTimer();

      if (timeLeft <= 0) {
        stopTimer();
        setTimeout(endGame, 350);
      }
    }

    function updateHighScore() {
      if (score > highScore) {
        highScore = score;
        localStorage.setItem("flagGameHighScore", String(highScore));
        highScoreEl.textContent = highScore;
      }

      if (currentUser && score > cloudHighScore) {
        saveCloudHighScore();
      }
    }

    function loadQuestion() {
      answered = false;
      feedbackEl.textContent = "";
      nextBtn.style.display = "none";
      gameOverEl.style.display = "none";

      if (!deck.length) resetDeck();

      currentQuestion = deck.pop();
      flagEl.textContent = currentQuestion.flag;

      answersEl.innerHTML = "";
      shuffle(currentQuestion.choices).forEach(choice => {
        const btn = document.createElement("button");
        btn.className = "answer";
        btn.type = "button";
        btn.textContent = choice;
        btn.addEventListener("click", () => chooseAnswer(btn, choice));
        answersEl.appendChild(btn);
      });
    }

    function chooseAnswer(button, choice) {
      if (answered) return;
      answered = true;

      if (!timerStarted) {
        timerStarted = true;
        startTimer();
      }

      const buttons = [...answersEl.querySelectorAll(".answer")];
      buttons.forEach(btn => btn.disabled = true);

      if (choice === currentQuestion.country) {
        score += 1;
        scoreEl.textContent = score;
        button.classList.add("correct");
        feedbackEl.textContent = "Correct! +1";
        updateHighScore();
      } else {
        button.classList.add("wrong");
        const correctBtn = buttons.find(btn => btn.textContent === currentQuestion.country);
        if (correctBtn) correctBtn.classList.add("correct");
        subtractTime(5);
        feedbackEl.textContent = `It was ${currentQuestion.country}. −5 seconds`;
      }

      if (timeLeft > 0) {
        nextBtn.style.display = "block";
      }
    }

    function endGame() {
      stopTimer();
      answersEl.style.display = "none";
      feedbackEl.style.display = "none";
      nextBtn.style.display = "none";
      document.querySelector(".flag-card").style.display = "none";
      document.querySelector(".prompt").style.display = "none";

      finalScoreEl.textContent = score;
      gameOverEl.style.display = "block";
      restartBtn.style.display = "block";
      updateHighScore();
    }

    function restartGame() {
      score = 0;
      timeLeft = 120;
      timerStarted = false;
      stopTimer();
      scoreEl.textContent = "0";
      updateTimer();

      answersEl.style.display = "grid";
      feedbackEl.style.display = "grid";
      document.querySelector(".flag-card").style.display = "grid";
      document.querySelector(".prompt").style.display = "block";
      restartBtn.style.display = "none";

      resetDeck();
      loadQuestion();
    }

    nextBtn.addEventListener("click", loadQuestion);
    restartBtn.addEventListener("click", restartGame);

    const ham = document.getElementById("ham");
    const navMenu = document.getElementById("navMenu");

    ham.addEventListener("click", () => {
      navMenu.classList.toggle("open");
      ham.setAttribute("aria-expanded", navMenu.classList.contains("open"));
    });

      document.getElementById("nav").classList.toggle("scrolled", window.scrollY > 10);
    });

      currentUser = user;

      if (user) {
        const firstName =

        authLink.textContent = "Sign in";
        authLink.href = "signin.html?redirect=flags.html";
      }
    });

    resetDeck();
