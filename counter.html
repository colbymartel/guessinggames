<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Subscriber Counter</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #00ff00;
      font-family: Arial, Helvetica, sans-serif;
    }

    .counter-card {
      width: 820px;
      height: 260px;
      background: white;
      border-radius: 28px;
      display: flex;
      align-items: center;
      padding: 35px;
      box-sizing: border-box;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.18);
      position: relative;
      overflow: hidden;
    }

    .profile {
      width: 175px;
      height: 175px;
      border-radius: 50%;
      object-fit: cover;
      margin-right: 38px;
      background: #eee;
    }

    .info {
      flex: 1;
    }

    .top-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
    }

    .name {
      font-weight: 800;
      font-size: 28px;
      color: #000;
    }

    .verified {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: #888;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: bold;
    }

    .subscribe {
      background: #ff0000;
      color: white;
      border: none;
      border-radius: 4px;
      font-size: 18px;
      font-weight: 800;
      padding: 7px 13px;
      margin-left: 12px;
    }

    .number-wrap {
      position: relative;
      width: fit-content;
    }

    #counter {
      font-size: 74px;
      line-height: 1;
      font-weight: 950;
      letter-spacing: -4px;
      color: #000;
      position: relative;
      z-index: 3;
    }

    .glitch::before,
    .glitch::after {
      content: attr(data-text);
      position: absolute;
      left: 0;
      top: 0;
      font-size: 74px;
      font-weight: 950;
      letter-spacing: -4px;
      line-height: 1;
      z-index: 1;
      opacity: 0.18;
      color: black;
      pointer-events: none;
    }

    .glitch::before {
      transform: translate(-1px, 1px);
    }

    .glitch::after {
      transform: translate(1px, -1px);
    }

    .counting {
      animation: softShake 0.14s infinite;
      filter: blur(0.8px);
    }

    .hit-million {
      animation: pop 0.45s ease-out;
      filter: blur(0);
    }

    .label {
      font-size: 42px;
      font-weight: 300;
      color: #9b9b9b;
      margin-top: 8px;
      letter-spacing: 1px;
    }

    .controls {
      position: fixed;
      bottom: 35px;
      display: flex;
      gap: 12px;
      align-items: center;
    }

    button.control {
      font-size: 18px;
      padding: 12px 20px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 700;
      background: #111;
      color: white;
    }

    input {
      font-size: 18px;
      padding: 12px;
      border-radius: 10px;
      border: 2px solid #aaa;
      width: 120px;
    }

    .input-label {
      font-size: 16px;
      font-weight: 700;
      color: #222;
      background: white;
      padding: 10px 12px;
      border-radius: 10px;
    }

    @keyframes softShake {
      0% {
        transform: translate(0, 0);
      }

      25% {
        transform: translate(0.5px, -0.5px);
      }

      50% {
        transform: translate(-0.5px, 0.5px);
      }

      75% {
        transform: translate(0.5px, 0.25px);
      }

      100% {
        transform: translate(0, 0);
      }
    }

    @keyframes pop {
      0% {
        transform: scale(1);
      }

      45% {
        transform: scale(1.16);
      }

      100% {
        transform: scale(1);
      }
    }

    .confetti {
      position: absolute;
      width: 10px;
      height: 16px;
      top: -20px;
      animation: fall 1.6s linear forwards;
      opacity: 0.9;
    }

    @keyframes fall {
      to {
        transform: translateY(320px) rotate(540deg);
        opacity: 0;
      }
    }
  </style>
</head>

<body>

  <div class="counter-card" id="counterCard">
    <img
      class="profile"
      id="profileImage"
      src="images/pfpnew.jpg"
      onerror="this.src='https://via.placeholder.com/175x175.png?text=Colby'"
      alt="Profile"
    />

    <div class="info">
      <div class="top-row">
        <div class="name">Colby Martel</div>
        <div class="verified">✓</div>
        <button class="subscribe">Subscribe</button>
      </div>

      <div class="number-wrap">
        <div id="counter" class="glitch" data-text="0">0</div>
      </div>

      <div class="label">Total Subscribers</div>
    </div>
  </div>

  <div class="controls">
    <span class="input-label">Seconds</span>
    <input id="durationInput" type="number" value="8" min="1" max="60" />
    <button class="control" onclick="startCounter()">Start Counter</button>
    <button class="control" onclick="resetCounter()">Reset</button>
    <button class="control" onclick="download4K()">Download 4K PNG</button>
  </div>

  <script>
    const counter = document.getElementById("counter");
    const durationInput = document.getElementById("durationInput");
    const profileImage = document.getElementById("profileImage");

    let animationFrame;

    function formatNumber(num) {
      return Math.floor(num).toLocaleString("en-US");
    }

    function startCounter() {
      cancelAnimationFrame(animationFrame);

      const start = 0;
      const end = 1000000;
      const duration = Number(durationInput.value) * 1000;
      const startTime = performance.now();

      counter.classList.remove("hit-million");
      counter.classList.add("counting");

      function animate(currentTime) {
        const elapsed = currentTime - startTime;
        const progress = Math.min(elapsed / duration, 1);

        // Linear count: same speed throughout
        const currentNumber = start + (end - start) * progress;
        const formatted = formatNumber(currentNumber);

        counter.textContent = formatted;
        counter.setAttribute("data-text", formatted);

        if (progress < 1) {
          animationFrame = requestAnimationFrame(animate);
        } else {
          counter.textContent = "1,000,000";
          counter.setAttribute("data-text", "1,000,000");

          counter.classList.remove("counting");
          counter.classList.add("hit-million");

          launchConfetti();
        }
      }

      animationFrame = requestAnimationFrame(animate);
    }

    function resetCounter() {
      cancelAnimationFrame(animationFrame);

      counter.textContent = "0";
      counter.setAttribute("data-text", "0");
      counter.classList.remove("counting", "hit-million");

      removeExistingConfetti();
    }

    function launchConfetti() {
      const card = document.querySelector(".counter-card");

      removeExistingConfetti();

      for (let i = 0; i < 80; i++) {
        const piece = document.createElement("div");
        piece.className = "confetti";

        piece.style.left = Math.random() * 820 + "px";
        piece.style.background = randomColor();
        piece.style.animationDelay = Math.random() * 0.5 + "s";
        piece.style.transform = `rotate(${Math.random() * 360}deg)`;

        card.appendChild(piece);

        setTimeout(() => {
          piece.remove();
        }, 2200);
      }
    }

    function removeExistingConfetti() {
      document.querySelectorAll(".confetti").forEach(piece => piece.remove());
    }

    function randomColor() {
      const colors = [
        "#ff0000",
        "#00c2ff",
        "#ffd700",
        "#00d26a",
        "#ff66c4",
        "#7b61ff"
      ];

      return colors[Math.floor(Math.random() * colors.length)];
    }

    async function download4K() {
      const canvas = document.createElement("canvas");
      const ctx = canvas.getContext("2d");

      canvas.width = 3840;
      canvas.height = 2160;

      const scale = 4;

      // Green screen background
      ctx.fillStyle = "#00ff00";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      const cardWidth = 820 * scale;
      const cardHeight = 260 * scale;
      const cardX = (canvas.width - cardWidth) / 2;
      const cardY = (canvas.height - cardHeight) / 2;

      // Card shadow
      ctx.save();
      ctx.shadowColor = "rgba(0, 0, 0, 0.18)";
      ctx.shadowBlur = 50 * scale;
      ctx.shadowOffsetY = 20 * scale;

      roundRect(ctx, cardX, cardY, cardWidth, cardHeight, 28 * scale);
      ctx.fillStyle = "white";
      ctx.fill();
      ctx.restore();

      // Card itself
      roundRect(ctx, cardX, cardY, cardWidth, cardHeight, 28 * scale);
      ctx.fillStyle = "white";
      ctx.fill();

      // Profile image
      const profileX = cardX + 35 * scale;
      const profileY = cardY + 42.5 * scale;
      const profileSize = 175 * scale;

      ctx.save();
      ctx.beginPath();
      ctx.arc(
        profileX + profileSize / 2,
        profileY + profileSize / 2,
        profileSize / 2,
        0,
        Math.PI * 2
      );
      ctx.clip();

      try {
        await drawProfileImage(ctx, profileImage, profileX, profileY, profileSize, profileSize);
      } catch (e) {
        ctx.fillStyle = "#eeeeee";
        ctx.fillRect(profileX, profileY, profileSize, profileSize);

        ctx.fillStyle = "#111";
        ctx.font = `700 ${34 * scale}px Arial`;
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText("Colby", profileX + profileSize / 2, profileY + profileSize / 2);
      }

      ctx.restore();

      // Text positions
      const textX = cardX + 248 * scale;
      const topY = cardY + 72 * scale;

      // Name
      ctx.fillStyle = "#000";
      ctx.font = `800 ${28 * scale}px Arial`;
      ctx.textAlign = "left";
      ctx.textBaseline = "middle";
      ctx.fillText("Colby Martel", textX, topY);

      // Verified circle
      const checkX = textX + 190 * scale;

      ctx.beginPath();
      ctx.arc(checkX, topY, 10 * scale, 0, Math.PI * 2);
      ctx.fillStyle = "#888";
      ctx.fill();

      ctx.fillStyle = "white";
      ctx.font = `bold ${13 * scale}px Arial`;
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText("✓", checkX, topY + 1 * scale);

      // Subscribe button
      const subX = checkX + 28 * scale;
      const subY = topY - 18 * scale;
      const subW = 110 * scale;
      const subH = 36 * scale;

      ctx.fillStyle = "#ff0000";
      ctx.fillRect(subX, subY, subW, subH);

      ctx.fillStyle = "white";
      ctx.font = `800 ${18 * scale}px Arial`;
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText("Subscribe", subX + subW / 2, subY + subH / 2);

      // Counter number
      const currentNumber = counter.textContent || "0";

      ctx.fillStyle = "#000";
      ctx.font = `950 ${74 * scale}px Arial`;
      ctx.textAlign = "left";
      ctx.textBaseline = "top";
      ctx.fillText(currentNumber, textX, cardY + 105 * scale);

      // Label
      ctx.fillStyle = "#9b9b9b";
      ctx.font = `300 ${42 * scale}px Arial`;
      ctx.textAlign = "left";
      ctx.textBaseline = "top";
      ctx.fillText("Total Subscribers", textX, cardY + 178 * scale);

      // Download file
      const link = document.createElement("a");
      link.download = "subscriber-counter-4k.png";
      link.href = canvas.toDataURL("image/png");
      link.click();
    }

    function drawProfileImage(ctx, imageElement, x, y, width, height) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.crossOrigin = "anonymous";

        img.onload = () => {
          drawImageCover(ctx, img, x, y, width, height);
          resolve();
        };

        img.onerror = reject;
        img.src = imageElement.src;
      });
    }

    function drawImageCover(ctx, img, x, y, width, height) {
      const imgRatio = img.width / img.height;
      const boxRatio = width / height;

      let sourceX = 0;
      let sourceY = 0;
      let sourceWidth = img.width;
      let sourceHeight = img.height;

      if (imgRatio > boxRatio) {
        sourceWidth = img.height * boxRatio;
        sourceX = (img.width - sourceWidth) / 2;
      } else {
        sourceHeight = img.width / boxRatio;
        sourceY = (img.height - sourceHeight) / 2;
      }

      ctx.drawImage(
        img,
        sourceX,
        sourceY,
        sourceWidth,
        sourceHeight,
        x,
        y,
        width,
        height
      );
    }

    function roundRect(ctx, x, y, width, height, radius) {
      ctx.beginPath();
      ctx.moveTo(x + radius, y);
      ctx.lineTo(x + width - radius, y);
      ctx.quadraticCurveTo(x + width, y, x + width, y + radius);
      ctx.lineTo(x + width, y + height - radius);
      ctx.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
      ctx.lineTo(x + radius, y + height);
      ctx.quadraticCurveTo(x, y + height, x, y + height - radius);
      ctx.lineTo(x, y + radius);
      ctx.quadraticCurveTo(x, y, x + radius, y);
      ctx.closePath();
    }
  </script>

</body>
</html>
