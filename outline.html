<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Guess the Country by Outline | Guessing Games</title>

  <style>
    :root {
      --brand: #4f86b3;
      --brand-dark: #376f9c;
      --bg: #f6f9fc;
      --ink: #172331;
      --muted: #66788a;
      --line: #dbe6ef;
      --soft: #edf4fa;
      --white: #ffffff;
      --correct: #2f9e67;
      --correct-soft: #e9f7ef;
      --wrong: #d95b5b;
      --wrong-soft: #fff0f0;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system,
        BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    a { color: inherit; text-decoration: none; }

    nav {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 999;
      padding: 1.25rem 2.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(247, 250, 252, 0.92);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid rgba(79, 134, 179, 0.18);
      transition: background 0.3s, box-shadow 0.3s;
    }

    nav.scrolled {
      background: rgba(247, 250, 252, 0.98);
      box-shadow: 0 4px 24px rgba(79, 134, 179, 0.12);
    }

    .nav-logo {
      color: var(--brand);
      font-size: 1.3rem;
      font-weight: 800;
      letter-spacing: 0.05em;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 2.5rem;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .nav-links a {
      color: var(--muted);
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      transition: color 0.2s;
    }

    .nav-links a:hover,
    .nav-links a.active { color: var(--brand); }

    .nav-account {
      padding: 9px 14px !important;
      color: var(--ink) !important;
      background: var(--white);
      border: 1px solid var(--line);
      border-radius: 999px;
      letter-spacing: 0.04em !important;
      text-transform: none !important;
    }

    .hamburger {
      display: none;
      padding: 8px;
      color: var(--ink);
      background: none;
      border: 0;
      font-size: 1.25rem;
      cursor: pointer;
    }

    .page {
      width: min(100%, 980px);
      margin: 0 auto;
      padding: 128px 24px 64px;
    }

    .hero {
      display: grid;
      justify-items: center;
      text-align: center;
      gap: 12px;
      margin-bottom: 26px;
    }

    .eyebrow {
      color: var(--brand);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(42px, 8vw, 76px);
      line-height: 0.95;
      letter-spacing: -0.07em;
      font-weight: 850;
    }

    .subtitle {
      margin: 3px 0 0;
      color: var(--muted);
      font-size: 16px;
      font-weight: 550;
    }

    .game-shell {
      background: var(--white);
      border: 1px solid var(--line);
      border-radius: 28px;
      box-shadow: 0 20px 50px rgba(23, 35, 49, 0.08);
      overflow: hidden;
    }

    .game-topbar {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      padding: 18px;
      border-bottom: 1px solid var(--line);
      background: linear-gradient(180deg, #ffffff, #fbfdff);
    }

    .stat {
      min-height: 66px;
      display: grid;
      place-items: center;
      text-align: center;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: var(--soft);
    }

    .stat-label {
      display: block;
      margin-bottom: 3px;
      color: var(--muted);
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .stat-value {
      font-size: 22px;
      font-weight: 850;
      letter-spacing: -0.04em;
    }

    .strikes {
      display: inline-flex;
      gap: 5px;
      font-size: 20px;
    }

    .strike.used {
      opacity: 0.22;
      filter: grayscale(1);
    }

    .game-content {
      padding: 28px;
    }

    .outline-card {
      display: grid;
      place-items: center;
      min-height: 360px;
      padding: 26px;
      border-radius: 24px;
      background:
        radial-gradient(circle at 50% 12%, rgba(79,134,179,.14), transparent 42%),
        var(--soft);
      border: 1px solid var(--line);
    }

    .outline-wrap {
      width: min(100%, 420px);
      height: 290px;
      display: grid;
      place-items: center;
    }

    .outline-wrap svg {
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    .country-shape {
      fill: var(--brand);
      stroke: var(--brand-dark);
      stroke-width: 2.2;
      vector-effect: non-scaling-stroke;
      filter: drop-shadow(0 14px 22px rgba(55, 111, 156, 0.16));
    }

    .prompt {
      margin: 0 0 16px;
      font-size: clamp(22px, 4vw, 30px);
      line-height: 1.08;
      letter-spacing: -0.045em;
      font-weight: 850;
    }

    .answers {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
    }

    .answer {
      min-height: 62px;
      padding: 14px 18px;
      text-align: left;
      color: var(--ink);
      background: var(--white);
      border: 1px solid var(--line);
      border-radius: 18px;
      font: inherit;
      font-size: 16px;
      font-weight: 750;
      cursor: pointer;
      transition: transform .15s, border-color .15s, background .15s, box-shadow .15s;
    }

    .answer:hover:not(:disabled) {
      transform: translateY(-2px);
      border-color: var(--brand);
      box-shadow: 0 10px 24px rgba(79, 134, 179, 0.12);
    }

    .answer.correct {
      background: var(--correct-soft);
      border-color: var(--correct);
      color: #1f704b;
    }

    .answer.wrong {
      background: var(--wrong-soft);
      border-color: var(--wrong);
      color: #9e3838;
    }

    .answer:disabled { cursor: default; }

    .feedback {
      min-height: 44px;
      display: grid;
      place-items: center;
      margin-top: 14px;
      text-align: center;
      color: var(--muted);
      font-size: 15px;
      font-weight: 700;
    }

    .next-btn,
    .restart-btn {
      display: none;
      width: 100%;
      min-height: 54px;
      margin-top: 4px;
      border: 0;
      border-radius: 999px;
      background: var(--brand);
      color: white;
      font: inherit;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
    }

    .next-btn:hover,
    .restart-btn:hover { background: var(--brand-dark); }

    .game-over {
      display: none;
      text-align: center;
      padding: 20px 4px 6px;
      grid-column: 1 / -1;
    }

    .game-over-icon {
      font-size: 54px;
      margin-bottom: 10px;
    }

    .game-over h2 {
      margin: 0;
      font-size: 38px;
      letter-spacing: -0.06em;
    }

    .game-over p {
      margin: 10px 0 22px;
      color: var(--muted);
      font-size: 16px;
      font-weight: 600;
    }

    .final-score {
      color: var(--brand);
      font-weight: 850;
    }

    @media (min-width: 901px) {
      .game-content {
        display: grid;
        grid-template-columns: minmax(0, 1.12fr) minmax(320px, .88fr);
        grid-template-areas: "outline side";
        gap: 24px;
        align-items: center;
      }

      .outline-card { grid-area: outline; }

      .desktop-side {
        grid-area: side;
        display: flex;
        flex-direction: column;
      }

      .desktop-side .prompt { text-align: left; }
    }

    @media (max-width: 900px) {
      nav { padding: 1rem 1.5rem; }
      .nav-links { display: none; }
      .hamburger { display: block; }

      .nav-links.open {
        position: fixed;
        top: 62px;
        left: 0;
        right: 0;
        display: flex;
        flex-direction: column;
        align-items: stretch;
        gap: 0;
        padding: 1rem 1.5rem 1.5rem;
        background: rgba(247, 250, 252, 0.98);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border-bottom: 1px solid var(--line);
        box-shadow: 0 12px 30px rgba(23, 35, 49, 0.08);
      }

      .nav-links.open li { width: 100%; }
      .nav-links.open a {
        display: block;
        width: 100%;
        padding: 14px 4px;
        border-bottom: 1px solid rgba(79, 134, 179, 0.10);
      }

      .outline-card {
        margin-bottom: 22px;
      }

      .prompt {
        text-align: center;
      }

      .answers {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 620px) {
      .page { padding: 108px 14px 38px; }
      nav { padding: 0.95rem 1rem; }
      .nav-logo { font-size: 1.1rem; }
      .nav-links.open { top: 58px; padding-left: 1rem; padding-right: 1rem; }

      h1 { font-size: 46px; }

      .game-topbar {
        grid-template-columns: 1fr 1fr;
      }

      .game-topbar .stat:last-child {
        grid-column: 1 / -1;
      }

      .game-content { padding: 18px; }

      .outline-card {
        min-height: 240px;
        padding: 16px;
      }

      .outline-wrap {
        height: 205px;
      }

      .answers { grid-template-columns: 1fr; }

      .answer {
        min-height: 58px;
        text-align: center;
      }
    }
  </style>
</head>

<body>
  <nav id="nav">
    <a href="index.html" class="nav-logo">Guessing Games</a>

    <ul class="nav-links" id="navMenu">
      <li><a href="index.html">Home</a></li>
      <li><a href="country-outline.html" class="active">Games</a></li>
      <li><a href="halloffame.html">Hall of Fame</a></li>
      <li><a href="live.html">Live Shows</a></li>
      <li><a href="signin.html?redirect=country-outline.html" class="nav-account">Sign in</a></li>
    </ul>

    <button class="hamburger" id="ham" type="button" aria-label="Open navigation" aria-expanded="false">☰</button>
  </nav>

  <main class="page">
    <section class="hero">
      <div class="eyebrow">Geography Challenge</div>
      <h1>Guess the Country</h1>
      <p class="subtitle">Identify the country by its outline. Three strikes and you're out.</p>
    </section>

    <section class="game-shell">
      <div class="game-topbar">
        <div class="stat">
          <div>
            <span class="stat-label">Score</span>
            <span class="stat-value" id="score">0</span>
          </div>
        </div>

        <div class="stat">
          <div>
            <span class="stat-label">High Score</span>
            <span class="stat-value" id="highScore">0</span>
          </div>
        </div>

        <div class="stat">
          <div>
            <span class="stat-label">Strikes</span>
            <span class="strikes" id="strikes">
              <span class="strike">❌</span>
              <span class="strike">❌</span>
              <span class="strike">❌</span>
            </span>
          </div>
        </div>
      </div>

      <div class="game-content">
        <div class="outline-card">
          <div class="outline-wrap" id="outlineWrap"></div>
        </div>

        <div class="desktop-side">
          <h2 class="prompt">Which country is this?</h2>
          <div class="answers" id="answers"></div>
          <div class="feedback" id="feedback"></div>
          <button class="next-btn" id="nextBtn">Next Country →</button>
        </div>

        <div class="game-over" id="gameOver">
          <div class="game-over-icon">🗺️</div>
          <h2>Game Over</h2>
          <p>You scored <span class="final-score" id="finalScore">0</span>.</p>
          <button class="restart-btn" id="restartBtn">Play Again</button>
        </div>
      </div>
    </section>
  </main>

  <script>
    /*
      Simplified SVG silhouettes designed for a fast browser game.
      They are intentionally stylized rather than cartographically exact.
    */
    const questions = [
      {
        country: "United States",
        viewBox: "0 0 300 180",
        path: "M25 68 L45 47 L83 46 L97 36 L126 42 L150 34 L185 43 L203 39 L232 53 L259 51 L278 69 L270 90 L247 92 L237 109 L216 111 L206 132 L180 134 L163 119 L143 126 L125 111 L103 113 L88 99 L64 101 L48 89 L29 88 Z",
        choices: ["United States", "Canada", "Mexico", "Brazil"]
      },
      {
        country: "France",
        viewBox: "0 0 220 220",
        path: "M72 30 L124 22 L168 56 L180 104 L149 156 L111 190 L70 166 L38 120 L44 68 Z",
        choices: ["France", "Spain", "Germany", "Belgium"]
      },
      {
        country: "Italy",
        viewBox: "0 0 220 260",
        path: "M91 22 L129 33 L137 72 L125 101 L149 129 L143 156 L165 184 L145 202 L126 187 L108 212 L83 228 L70 209 L88 188 L74 164 L91 143 L76 120 L83 92 L70 65 Z M132 221 L157 210 L171 223 L155 239 Z",
        choices: ["Italy", "Greece", "Portugal", "Croatia"]
      },
      {
        country: "Japan",
        viewBox: "0 0 180 300",
        path: "M93 18 L111 33 L106 56 L119 75 L106 94 L116 111 L101 135 L109 158 L91 176 L102 199 L83 220 L91 246 L73 278 L58 261 L62 234 L49 211 L64 189 L57 164 L70 143 L61 120 L74 101 L68 78 L82 59 L77 37 Z",
        choices: ["Japan", "Philippines", "Indonesia", "South Korea"]
      },
      {
        country: "Brazil",
        viewBox: "0 0 250 250",
        path: "M74 24 L125 18 L158 36 L191 47 L218 82 L205 120 L181 140 L171 178 L145 220 L113 205 L94 175 L66 161 L49 130 L27 100 L42 69 Z",
        choices: ["Brazil", "Argentina", "Colombia", "Peru"]
      },
      {
        country: "Australia",
        viewBox: "0 0 280 220",
        path: "M35 91 L60 57 L104 47 L140 35 L188 47 L224 69 L250 101 L232 139 L198 158 L176 190 L136 178 L111 157 L72 160 L45 137 Z",
        choices: ["Australia", "New Zealand", "South Africa", "Madagascar"]
      },
      {
        country: "India",
        viewBox: "0 0 220 280",
        path: "M76 24 L129 20 L168 48 L177 84 L157 111 L147 151 L126 185 L112 230 L94 258 L80 229 L65 196 L48 162 L51 126 L31 99 L45 60 Z",
        choices: ["India", "Pakistan", "Bangladesh", "Nepal"]
      },
      {
        country: "Mexico",
        viewBox: "0 0 300 220",
        path: "M31 55 L71 45 L112 55 L145 51 L178 62 L212 58 L253 82 L271 106 L249 126 L224 120 L208 142 L185 133 L167 113 L145 104 L121 91 L94 88 L78 110 L60 100 L45 78 Z",
        choices: ["Mexico", "Chile", "Peru", "Cuba"]
      },
      {
        country: "Argentina",
        viewBox: "0 0 180 300",
        path: "M75 20 L111 29 L126 58 L117 94 L130 126 L115 159 L122 190 L106 220 L99 256 L81 280 L68 249 L58 215 L66 181 L52 151 L61 119 L51 88 L61 56 Z",
        choices: ["Argentina", "Chile", "Uruguay", "Peru"]
      },
      {
        country: "United Kingdom",
        viewBox: "0 0 200 270",
        path: "M92 20 L119 42 L114 67 L135 84 L123 109 L139 128 L126 148 L105 145 L95 170 L112 189 L98 222 L72 242 L65 214 L73 188 L57 166 L68 143 L55 118 L68 94 L61 68 L78 50 Z M146 164 L159 173 L154 189 L140 185 Z",
        choices: ["United Kingdom", "Ireland", "Iceland", "Norway"]
      },
      {
        country: "Germany",
        viewBox: "0 0 220 240",
        path: "M83 22 L132 28 L158 53 L151 86 L170 111 L151 136 L157 171 L131 207 L91 216 L63 190 L50 157 L57 129 L41 96 L57 68 Z",
        choices: ["Germany", "Poland", "Austria", "France"]
      },
      {
        country: "Spain",
        viewBox: "0 0 250 220",
        path: "M44 52 L86 37 L136 42 L177 36 L210 57 L213 91 L188 122 L157 153 L117 167 L77 156 L48 132 L31 95 Z",
        choices: ["Spain", "Portugal", "France", "Italy"]
      },
      {
        country: "China",
        viewBox: "0 0 300 230",
        path: "M48 58 L85 34 L128 40 L161 24 L199 43 L238 49 L268 79 L253 111 L225 120 L218 151 L180 164 L155 190 L118 175 L93 151 L59 145 L38 113 L27 82 Z",
        choices: ["China", "Mongolia", "India", "Russia"]
      },
      {
        country: "South Africa",
        viewBox: "0 0 250 220",
        path: "M54 37 L101 29 L143 38 L191 36 L216 60 L205 96 L184 122 L161 158 L126 188 L92 179 L64 155 L49 126 L31 95 Z",
        choices: ["South Africa", "Namibia", "Botswana", "Zimbabwe"]
      },
      {
        country: "Egypt",
        viewBox: "0 0 230 220",
        path: "M49 38 L169 37 L187 63 L176 91 L186 119 L172 157 L154 189 L112 179 L72 187 L45 155 L47 110 L38 73 Z",
        choices: ["Egypt", "Libya", "Sudan", "Saudi Arabia"]
      },
      {
        country: "Norway",
        viewBox: "0 0 180 300",
        path: "M86 18 L113 33 L105 56 L119 73 L106 96 L114 119 L96 141 L102 167 L87 192 L94 215 L78 239 L80 273 L61 282 L55 250 L63 221 L51 195 L61 169 L49 141 L61 116 L52 89 L66 65 L62 40 Z",
        choices: ["Norway", "Sweden", "Finland", "Chile"]
      }
    ];

    const outlineWrap = document.getElementById("outlineWrap");
    const answersEl = document.getElementById("answers");
    const scoreEl = document.getElementById("score");
    const highScoreEl = document.getElementById("highScore");
    const strikesEl = document.getElementById("strikes");
    const feedbackEl = document.getElementById("feedback");
    const nextBtn = document.getElementById("nextBtn");
    const restartBtn = document.getElementById("restartBtn");
    const gameOverEl = document.getElementById("gameOver");
    const finalScoreEl = document.getElementById("finalScore");

    let score = 0;
    let strikes = 0;
    let currentQuestion = null;
    let answered = false;
    let deck = [];

    let highScore = Number(localStorage.getItem("countryOutlineHighScore") || 0);
    highScoreEl.textContent = highScore;

    function shuffle(array) {
      const copy = [...array];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function resetDeck() {
      // Endless mode: after all countries have appeared, reshuffle and keep going.
      // The game only ends after the player reaches 3 strikes.
      deck = shuffle(questions);
    }

    function updateStrikes() {
      [...strikesEl.querySelectorAll(".strike")].forEach((el, index) => {
        el.classList.toggle("used", index >= strikes);
      });
    }

    function updateHighScore() {
      if (score > highScore) {
        highScore = score;
        localStorage.setItem("countryOutlineHighScore", String(highScore));
        highScoreEl.textContent = highScore;
      }
    }

    function renderOutline(q) {
      outlineWrap.innerHTML = `
        <svg viewBox="${q.viewBox}" role="img" aria-label="Country outline">
          <path class="country-shape" d="${q.path}"></path>
        </svg>
      `;
    }

    function loadQuestion() {
      answered = false;
      feedbackEl.textContent = "";
      nextBtn.style.display = "none";
      gameOverEl.style.display = "none";

      if (!deck.length) resetDeck();

      currentQuestion = deck.pop();
      renderOutline(currentQuestion);

      answersEl.innerHTML = "";
      shuffle(currentQuestion.choices).forEach(choice => {
        const btn = document.createElement("button");
        btn.className = "answer";
        btn.type = "button";
        btn.textContent = choice;
        btn.addEventListener("click", () => chooseAnswer(btn, choice));
        answersEl.appendChild(btn);
      });
    }

    function chooseAnswer(button, choice) {
      if (answered) return;
      answered = true;

      const buttons = [...answersEl.querySelectorAll(".answer")];
      buttons.forEach(btn => btn.disabled = true);

      if (choice === currentQuestion.country) {
        score += 1;
        scoreEl.textContent = score;
        button.classList.add("correct");
        feedbackEl.textContent = "Correct! +1";
        updateHighScore();
      } else {
        strikes += 1;
        button.classList.add("wrong");

        const correctBtn = buttons.find(btn => btn.textContent === currentQuestion.country);
        if (correctBtn) correctBtn.classList.add("correct");

        feedbackEl.textContent = `It was ${currentQuestion.country}.`;
        updateStrikes();
      }

      if (strikes >= 3) {
        setTimeout(endGame, 650);
      } else {
        nextBtn.style.display = "block";
      }
    }

    function endGame() {
      document.querySelector(".outline-card").style.display = "none";
      document.querySelector(".desktop-side").style.display = "none";

      finalScoreEl.textContent = score;
      gameOverEl.style.display = "block";
      restartBtn.style.display = "block";
      updateHighScore();
    }

    function restartGame() {
      score = 0;
      strikes = 0;
      scoreEl.textContent = "0";
      updateStrikes();

      document.querySelector(".outline-card").style.display = "grid";
      document.querySelector(".desktop-side").style.display = "flex";
      restartBtn.style.display = "none";

      resetDeck();
      loadQuestion();
    }

    nextBtn.addEventListener("click", loadQuestion);
    restartBtn.addEventListener("click", restartGame);

    const ham = document.getElementById("ham");
    const navMenu = document.getElementById("navMenu");

    ham.addEventListener("click", () => {
      navMenu.classList.toggle("open");
      ham.setAttribute("aria-expanded", navMenu.classList.contains("open"));
    });

    window.addEventListener("scroll", () => {
      document.getElementById("nav").classList.toggle("scrolled", window.scrollY > 10);
    });

    updateStrikes();
    resetDeck();
    loadQuestion();
  </script>
</body>
</html>
