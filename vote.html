<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Name Hall of Fame</title>
  <style>
    :root {
      --brand: #4f86b3;
      --brand-dark: #376f9c;
      --bg: #f6f9fc;
      --ink: #172331;
      --muted: #66788a;
      --line: #dbe6ef;
      --soft: #edf4fa;
      --white: #ffffff;
      --success: #1f7a4d;
      --danger: #b42318;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    a { color: inherit; text-decoration: none; }
    button, input { font: inherit; }
    button { cursor: pointer; }

    .page {
      width: min(100%, 1040px);
      margin: 0 auto;
      padding: 28px 24px 56px;
    }

    nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 28px;
      border-bottom: 1px solid var(--line);
    }

    .logo {
      font-size: 18px;
      letter-spacing: -0.04em;
      font-weight: 800;
    }

    .links {
      display: flex;
      align-items: center;
      gap: 24px;
      color: var(--muted);
      font-size: 14px;
      font-weight: 600;
    }

    .links a:hover { color: var(--ink); }

    .nav-btn {
      color: var(--ink);
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 9px 14px;
      background: var(--white);
      max-width: 180px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .hero {
      display: grid;
      gap: 16px;
      padding: 56px 0 18px;
      justify-items: center;
      text-align: center;
    }

    .eyebrow {
      color: var(--brand);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      max-width: 720px;
      font-size: clamp(44px, 8vw, 88px);
      line-height: 0.94;
      letter-spacing: -0.08em;
      font-weight: 850;
    }

    .subhead {
      margin: 0;
      max-width: 520px;
      color: var(--muted);
      font-size: 18px;
      line-height: 1.5;
    }

    .panel {
      background: var(--white);
      border: 1px solid var(--line);
      border-radius: 24px;
    }

    .vote-panel {
      max-width: 1180px;
      padding: 24px;
      margin: 0 auto 0;
    }

    .options {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 18px;
    }

    .option {
      min-height: 318px;
      padding: 12px 12px 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 16px;
      text-align: center;
      color: var(--ink);
      background: var(--white);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: 0 16px 34px rgba(23, 35, 49, 0.08);
      transition: border-color 0.16s ease, box-shadow 0.16s ease, transform 0.16s ease;
    }

    .option:hover,
    .option.selected {
      border-color: var(--brand);
      box-shadow: 0 20px 44px rgba(79, 134, 179, 0.16);
      transform: translateY(-3px);
    }

    .option.selected {
      background:
        linear-gradient(180deg, rgba(79, 134, 179, 0.10), rgba(255,255,255,1) 45%),
        var(--white);
      border-color: var(--brand);
    }

    .option.selected .option-image {
      outline: 3px solid var(--brand);
      outline-offset: 0;
    }

    .option.selected .option-name { color: var(--brand-dark); }

    .option:disabled {
      color: var(--ink);
      cursor: not-allowed;
      opacity: 0.65;
      transform: none;
    }

    .option-image {
      position: relative;
      width: 100%;
      aspect-ratio: 1 / 1;
      min-height: 0;
      height: auto;
      border-radius: 5px;
      overflow: hidden;
      display: block;
      background: var(--soft);
    }

    .option-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .option-image::after {
      content: "";
      position: absolute;
      inset: 10px;
      border: 1px solid rgba(255,255,255,0.28);
      border-radius: 4px;
    }

    .option-copy {
      display: grid;
      gap: 8px;
      justify-items: center;
      padding: 0 6px;
    }

    .option-name {
      font-size: 32px;
      line-height: 1;
      letter-spacing: -0.06em;
      font-weight: 820;
    }

    .vote-button {
      width: 100%;
      margin-top: 16px;
      min-height: 54px;
      border: 0;
      border-radius: 999px;
      background: var(--brand);
      color: white;
      font-size: 17px;
      font-weight: 750;
      transition: opacity 0.16s ease, background 0.16s ease;
    }

    .vote-button:hover { background: var(--brand-dark); }

    .vote-button:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    .message {
      display: none;
      text-align: center;
      margin-top: 14px;
      color: var(--brand-dark);
      font-size: 14px;
      line-height: 1.4;
      font-weight: 650;
    }

    .message.show { display: block; }
    .message.error { color: var(--danger); }
    .message.success { color: var(--success); }

    @media (max-width: 620px) {
      .page { padding: 22px 16px 44px; }
      nav { align-items: flex-start; }
      .links { display: none; }
      .hero { padding: 42px 0 16px; }
      .options { grid-template-columns: 1fr; }
      .option { min-height: 292px; }
      .option-image { height: 220px; }
    }
  </style>
</head>
<body>
  <main class="page">
    <nav>
      <a class="logo" href="index.html">Guessing Games</a>

      <div class="links">
        <a href="index.html">Games</a>
        <a href="halloffame.html">Hall of Fame</a>
        <a href="live.html">Live Shows</a>
        <a href="about.html">About</a>
        <a class="nav-btn" id="authLink" href="signin.html?redirect=vote.html">Sign in</a>
      </div>
    </nav>

    <section class="hero">
      <div class="eyebrow">Week 1</div>
      <h1>Name Hall of Fame</h1>
      <p class="subhead">Vote for one finalist to enter the Name Hall of Fame.</p>
    </section>

    <section>
      <div class="panel vote-panel">
        <div class="options" id="options"></div>
        <button class="vote-button" id="voteButton" disabled>Checking sign in...</button>
        <div class="message" id="message"></div>
      </div>
    </section>
  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
    import {
      getAuth,
      onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
    import {
      getFirestore,
      doc,
      getDoc,
      setDoc,
      increment,
      serverTimestamp
    } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyB-N0Y02yh3xoXSPu6XsqSZGP3m0ZxprpI",
      authDomain: "guessinggames.firebaseapp.com",
      projectId: "guessinggames",
      storageBucket: "guessinggames.firebasestorage.app",
      messagingSenderId: "431644741449",
      appId: "1:431644741449:web:0b699b3acdec1f95b19498"
    };

    const weeklyNames = [
      { name: "Frog", image: "images/frog.png" },
      { name: "Gengyzkhan", image: "images/gengyzkhan.jpg" },
      { name: "J", image: "images/j.jpg" },
      { name: "Naruto", image: "images/naruto.jpg" }
    ];

    const WEEK = 1;
    const ROUND = 1;
    const ROUND_ID = "week-1-round-1";
    const STORAGE_KEY = "gg_weekly_name_vote_week_1_round_1_multi_v1";

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let selectedName = null;
    let currentUser = null;
    let existingVote = null;
    let authReady = false;

    const optionsEl = document.getElementById("options");
    const voteButton = document.getElementById("voteButton");
    const messageEl = document.getElementById("message");
    const authLink = document.getElementById("authLink");

    function escapeHTML(str) {
      return String(str)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function escapeAttr(str) {
      return String(str).replaceAll("'", "\\'");
    }

    function firstNameFromUser(user) {
      const source = user.displayName || user.email || "there";
      return source.split(" ")[0].split("@")[0];
    }

    function setMessage(text, type = "") {
      messageEl.textContent = text;
      messageEl.className = "message show" + (type ? " " + type : "");
    }

    function clearMessage() {
      messageEl.textContent = "";
      messageEl.className = "message";
    }

    function getVoteRef(user) {
      return doc(db, "name-hall-of-fame-votes", ROUND_ID, "votes", user.uid);
    }

    function safeFieldName(value) {
      return String(value)
        .toLowerCase()
        .replace(/[^a-z0-9]+/g, "_")
        .replace(/^_+|_+$/g, "") || "unknown";
    }

    function updateVoteButton() {
      if (!authReady) {
        voteButton.disabled = true;
        voteButton.textContent = "Checking sign in...";
        return;
      }

      if (!currentUser) {
        voteButton.disabled = false;
        voteButton.textContent = "Sign in to vote";
        return;
      }

      if (existingVote) {
        voteButton.disabled = true;
        voteButton.textContent = "Already voted for " + existingVote.selected;
        return;
      }

      voteButton.disabled = !selectedName;
      voteButton.textContent = selectedName ? "Vote for " + selectedName : "Choose a name";
    }

    function renderOptions() {
      const optionsDisabled = !currentUser || !!existingVote;

      optionsEl.innerHTML = weeklyNames.map(item => {
        const selected = selectedName === item.name;
        return `
          <button class="option ${selected ? "selected" : ""}" ${optionsDisabled ? "disabled" : ""} data-name="${escapeAttr(item.name)}">
            <span class="option-image">
              <img src="${escapeAttr(item.image)}" alt="${escapeAttr(item.name)}" />
            </span>
            <span class="option-copy">
              <span class="option-name">${escapeHTML(item.name)}</span>
            </span>
          </button>
        `;
      }).join("");

      document.querySelectorAll(".option").forEach(button => {
        button.addEventListener("click", () => {
          if (!currentUser) {
            window.location.href = "signin.html?redirect=vote.html";
            return;
          }

          if (existingVote) return;

          selectedName = button.dataset.name;
          clearMessage();
          renderOptions();
          updateVoteButton();
        });
      });

      updateVoteButton();
    }

    async function loadUserVote(user) {
      const voteSnap = await getDoc(getVoteRef(user));
      existingVote = voteSnap.exists() ? voteSnap.data() : null;

      if (existingVote) {
        setMessage("You already voted in this round.", "success");
      } else {
        clearMessage();
      }

      renderOptions();
    }

    onAuthStateChanged(auth, async (user) => {
      currentUser = user;
      authReady = true;

      if (user) {
        const name = firstNameFromUser(user);
        authLink.textContent = "Hi, " + name;
        authLink.href = "signin.html";
        await loadUserVote(user);
      } else {
        existingVote = null;
        selectedName = null;
        authLink.textContent = "Sign in";
        authLink.href = "signin.html?redirect=vote.html";
        setMessage("Sign in to vote. Each account gets one vote per round.");
        renderOptions();
      }
    });

    voteButton.addEventListener("click", async () => {
      if (!currentUser) {
        window.location.href = "signin.html?redirect=vote.html";
        return;
      }

      if (existingVote) {
        setMessage("You already voted in this round.", "success");
        return;
      }

      if (!selectedName) return;

      try {
        voteButton.disabled = true;
        voteButton.textContent = "Submitting...";

        const voteRef = getVoteRef(currentUser);
        const latestVoteSnap = await getDoc(voteRef);

        if (latestVoteSnap.exists()) {
          existingVote = latestVoteSnap.data();
          renderOptions();
          setMessage("You already voted in this round.", "success");
          return;
        }

        const votePayload = {
          week: WEEK,
          round: ROUND,
          selected: selectedName,
          uid: currentUser.uid,
          displayName: currentUser.displayName || "",
          email: currentUser.email || "",
          photoURL: currentUser.photoURL || "",
          submittedAtLocal: new Date().toISOString(),
          userAgent: navigator.userAgent,
          page: window.location.pathname,
          createdAt: serverTimestamp()
        };

        await setDoc(voteRef, votePayload);

        const selectedKey = safeFieldName(selectedName);

        await setDoc(
          doc(db, "name-hall-of-fame-results", ROUND_ID),
          {
            week: WEEK,
            round: ROUND,
            totalVotes: increment(1),
            [`votes.${selectedKey}`]: increment(1),
            lastVoteAt: serverTimestamp()
          },
          { merge: true }
        );

        localStorage.setItem(STORAGE_KEY, JSON.stringify({
          hasVoted: true,
          selected: selectedName,
          names: weeklyNames,
          voteHistory: [
            {
              week: WEEK,
              round: ROUND,
              selected: selectedName,
              submittedAtLocal: new Date().toISOString(),
              page: window.location.pathname
            }
          ]
        }));

        window.location.href = "nextballot.html";
      } catch (error) {
        console.error("Vote save failed:", error);
        setMessage("Could not submit vote. Check Firebase rules and try again.", "error");
        updateVoteButton();
      }
    });

    renderOptions();
  </script>
</body>
</html>
